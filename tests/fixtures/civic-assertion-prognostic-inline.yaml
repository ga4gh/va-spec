      - description:
          The CRYSTAL Phase III Trial evaluated efficacy of irinotecan, fluorouracil,
          and leucovorin (FOLFIRI) with or without Cetuximab for colorectal cancer patients
          who presented with unresectable metastatic disease. BRAF mutation status (V600E)
          was analyzed via LightMix BRAF V600E Kit. V600E mutations were detected in 60/999
          tumor samples (6%), 59 of which were wild-type for KRAS. When comparing patients
          with wildtype KRAS (n=625), BRAF V600E tumors had worse outcomes relative to
          BRAF wildtype. For patients with BRAF V600E tumors (n=566), median overall survival
          (OS) was 25.1 months with cetuximab and 21.6 months without cetuximab. For patients
          with wildtype BRAF (n=59), median OS was 14.1 months with cetuximab and 10.3
          months without cetuximab.
