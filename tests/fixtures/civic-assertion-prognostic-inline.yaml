        type: Statement
      - description:
          In a study of 908 patients with colorectal cancer, 45 patients had
          BRAF V600E mutations and 589 patients were BRAF wild type.  BRAF V600E mutations
          were more likely to be proximal tumors (68.9%, 20.7%; p<0.0001), they were more
          likely to be poorly differentiated (17.7%, 1.9%; p<0.0001), they were more likely
          to be mucinous carcinoma type (20.0%, 4.2%; p=0.0003), they were more likely
          to have lymphatic invasion (77.6%, 49.9%; p=0.0003), and they had a shorter
          survival time (31.1 mo, 41.6 mo; p=0.001).  The 3-year survival rate was significantly
          poorer in the V600E group when compared to the wild type group (63.8%, 87.9%;
          p<0.0001).
        direction: supports
