        type: Statement
      - description:
          Patients with completely resected colorectal adenocarcinoma (Stage
          II-III) were treated with fluorouracil and leucovorin +/- ironotecan. Of the
          1,307 FFPE samples tested, V600E was observed in 31 Stage II samples (7.6%)
          and 72 Stage III samples (7.9%). V600E was prognostic for overall survival,
          but not for relapse-free survival, in patients with stages II and III combined,
          and in stage III alone. For all MSI low and stable tumors, BRAF V600E positive
          samples had a hazard ratio (HR) of 2.19 (95% CI, 1.43 to 3.37, P=0.00034). For
          all samples in the cohort (MSI-H and MSI-L) BRAF V600E positive samples had
          a 1.66 HR (95% CI, 1.15 to 2.40, P=0.0069). The authors note prognostic value
          for BRAF V600E, especially in non-MSI high tumors.
