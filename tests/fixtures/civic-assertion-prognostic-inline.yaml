classification:
  type: MappableConcept
  name: Tier I
  primaryCoding:
    code: tier i
    system: AMP/ASCO/CAP Guidelines, 2017
description:
  BRAF V600E was associated with worse prognosis in Phase II and III colorectal
  cancer, with a stronger effect in MSI-Low or MSI-Stable tumors. In metastatic CRC,
  V600E was associated with worse prognosis, and meta-analysis showed BRAF mutation
  in CRC associated with multiple negative prognostic markers.
direction: supports
hasEvidenceLines:
  - directionOfEvidenceProvided: supports
    hasEvidenceItems:
      - description:
          In the Medical Research Council (MRC) COIN trial, ISRCTN27286448,
          patients who presented with advanced colorectal cancer were randomly assigned
          to chemotherapy (oxaliplatin and fluoropyrimidine; arm A), or chemotherapy plus
          cetuximab (arm B). Median overall survival was found to differ by mutation,
          regardless of treatment. Median overall survival was 8.8 months (IQR 4.5-27)
          for patients with BRAF variants, 14.4 months (IQR 8.5-24.0) for patients with
          KRAS variants, and 20.1 months (IQR 11.5-31.7) for wildtype patients. BRAF mutations
          were found in 102/1291 samples (7.90%), and of these, 12 were D594G and 90 V600E.
        direction: supports
        id: civic.eid:7158
