        type: Statement
      - description:
          A meta analysis was performed using data from 21 published studies
          (n = 9885 patients) to assess prognostic value of BRAF mutations in colorectal
          cancer. When evaluating 14 studies (n = 7778 patients), the odds ratio (OR)
          of a proximal lesion, which is associated with greater mortality in colon cancer,
          was increased for patients with BRAF mutations (OR 5.222, 95% CI 3.801–7.174,
          P < 0.001). When evaluating 4 studies (n = 1526 patients), the odds ratio of
          T4 tumors, which indicates tumor growth past bowel lining, was increased for
          patients with BRAF mutations (OR 1.761, 95% CI 1.164–2.663, P = 0.007). When
          evaluating 8 studies (n = 2786 patients), the odds ratio of poor tumor differentiation
          was increased in patients with BRAF mutations (OR 3.816, 95% CI 2.714–5.365,
          P < 0.001). These results support that BRAF mutations indicate poor prognosis
          for patients with colorectal cancer.
        direction: supports
