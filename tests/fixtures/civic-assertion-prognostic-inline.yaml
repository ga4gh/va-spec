          dimers and are resistant to vemurafenib. Such mutants may be sensitive to
          novel RAF dimer inhibitors or MEK inhibitors.

          Class 3 BRAF mutations (D287H, V459L, G466V, G466E, G466A, S467L, G469E, N581S,
          N581I, D594N, D594G, D594A, D594H, F595L, G596D, and G596R) with low or absent
          kinase activity are RAS-dependent and they activate ERK by increasing their
          binding to activated RAS and wild-type CRAF. Class 3 BRAF mutations coexist
          with mutations in RAS or NF1 in melanoma may be treated with MEK inhibitors.
          In epithelial tumors such as CRC or NSCLC may be effectively treated with
          combinations that include inhibitors of receptor tyrosine kinase."
