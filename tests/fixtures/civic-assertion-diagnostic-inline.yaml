classification:
  name: Tier II
  primaryCoding:
    code: tier ii
    system: AMP/ASCO/CAP Guidelines, 2017
description:
  ACVR1 G328V mutations occur within the kinase domain, leading to activation
  of downstream signaling. Exclusively seen in high-grade pediatric gliomas, supporting
  diagnosis of diffuse intrinsic pontine glioma.
direction: supports
hasEvidenceLines:
  - directionOfEvidenceProvided: supports
    hasEvidenceItems:
      - description:
          Sequencing of 39 pediatric midline high-grade astrocytomas identified
          5 patients with ACVR1 mutations. The authors identified an increase in endogenous
          phospho-SMAD1/5/8 signal in diffuse intrinsic pontine glioma (DIPG) cells harboring
          ACVR1 G328V, with corresponding increase in phospho-SMAD1/5/8 staining as well.
          By PCR, the authors show strong increase in fold change of mRNA expression in
          downstream proteins of the ACVR1/BMP pathway, ID, ID2, ID3 and SNAI1 in ACVR1-mutant
          DIPG cell line compared to glioblastoma cells (KNS42 cells). These activating
          ACVR1 mutations were exclusively in midline high grade astrocytomas (P = 0.0040,
          Fisher's exact test).
        direction: supports
        id: civic.eid:4846
