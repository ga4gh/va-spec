      - description:
          In a study sequencing 61 patients (median age 6.3) with diffuse
          intrinsic pontine glioma (DIPG), 12 variants affecting ACVR1 were observed.
          Five patients had G328V within the kinase domain. The ACVR1 G328V mutation
          was expressed using the pCDH511b vector in immortalized normal human astrocytes
          (iNHAs) where it activated downstream BMP signaling and enhanced cell growth.
          Activating ACVR1 mutations are recurrent and support diagnosis of high grade
          glioma. PEDIATRIC
