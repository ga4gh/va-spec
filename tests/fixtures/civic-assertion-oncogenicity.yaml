id: civic.aid:202
type: Statement
description: "Published sequencing studies have shown that RET mutations are
  very common in medullary thryoid carcinoma (MTC) and M918T is the most common
  specific variant, especially in the MEN2B clinical subtype of familial disease
  (civic.EID:78) but also in sporadic cases(civic.EID:12800). M918T mutations
  may predict worse outcomes (civic.EID:74). Biochemical and functional
  characterization demonstrates that the M918T mutation leads to functional
  activation of RET relative to wild-type through multiple complementary
  mechanisms, including increased ATP affinity (>10-fold) and complex stability,
  reduced conformational rigidity, and the promotion of ligand-independent
  dimerization and autophosphorylation (civic.EID:12805). Exogenous expression
  has been shown to induce transformation of Ba/F3 cells (civic.EID:11723), and
  drive colony formation in NIH3T3 cells (civic.EID:12709, OS2). RET M918T
  occurs in the region of the tyrosine kinase domain which is associated with
  multiple endocrine neoplasia type 2 B (OM1). RET M918T is predicted to be
  deleterious (CHASMplus score 0.314 > VECS gene-specific cutoff of 0.22, OP1).
  Eleven instances of the variant occur in cancerhotspots.org (V2): 6 Thyroid, 4
  Adrenal Gland, 1 Breast (OP3). The variant is absent in gnomAD database
  (v4.1.0, OP4). Together these criteria indicate that M918T is likely
  oncogenic, with a score of 9."
