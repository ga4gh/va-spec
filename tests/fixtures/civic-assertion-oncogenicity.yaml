    contributor:
      description:
        The CIViC Organization (formerly “The McDonnell Genome Institute”
        CIViC organization) comprises the founders, developers, editors,
        curators, and administrators who build and maintain the knowledgebase,
        based at Washington University in St. Louis. This group is dedicated to
        ensuring that high-quality cancer variant interpretations are broadly
        accessible for precision oncology. One of their main roles is evaluating
        and synthesizing crowdsourced community contributions into formal
        clinical Assertions. Once these Assertions meet the strict criteria of
        the CIViC standard operating procedure, core approval members approve
        them for 1-star submission to the ClinVar CIViC organization.
