id: civic.aid:202
type: Statement
proposition:
  type: VariantOncogenicityProposition
  objectTumorType:
    id: civic.did:15
    conceptType: Disease
    name: Medullary Thyroid Carcinoma
    mappings:
      - coding:
          code: DOID:3973
          system: https://disease-ontology.org/?id=
        relation: exactMatch
  predicate: isOncogenicFor
  subjectVariant:
    id: civic.mpid:113
    type: CategoricalVariant
    description: RET M918T is the most common somatically acquired mutation in
      medullary thyroid cancer (MTC). While there currently are no RET-specific
      inhibiting agents, promiscuous kinase inhibitors have seen some success in
      treating RET overactivity. Data suggests however, that the M918T mutation
      may lead to drug resistance, especially against the VEGFR-inhibitor
      motesanib. It has also been suggested that RET M918T leads to more
      aggressive MTC with a poorer prognosis.
    name: RET M918T
    aliases:
      - MET918THRRS74799832
    mappings:
      - coding:
