      - description:
          In this Phase III trial (NCT01584648 COMBI-d), previously untreated
          patients with unresectable stage IIIC or IV melanoma with BRAF V600E (359
          patients) or V600K (61 patients) received dabrafenib and trametinib or dabrafenib
          alone with primary endpoint of progression free survival and secondary endpoints
          including disease response. The hazard ratio for progression or death in the
          V600E group was 0.81 for dabrafenib-trametinib vs dabrafenib-alone. Of 179
          V600E patients in the dabrafenib-trametinib group, 68% of patients had a response,
          which was 15 percentage points higher than in the dabrafenib-alone group (95%
          CI, 4 to 24; P=0.006).
