      - description:
          In this Phase I and II study (NCT01072175) patients with metastatic
          melanoma were given dabrafenib and trametinib combination therapy vs. dabrafenib
          monotherapy. From V600E patients, 45 received monotherapy and 92 received
          combination therapy. Hazard ratio for progression or death was 0.43 (95% CI,
          0.27-0.71). Both patients with the BRAF V600E and V600K mutation showed significant
          improvement in progression-free survival.
