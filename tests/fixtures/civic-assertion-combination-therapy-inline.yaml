    hasEvidenceItems:
      - description:
          Adjuvant dual treatment with BRAF inhibitor dabrafenib and MEK
          inhibitor trametinib was administered to patients with stage III resected
          melenoma with V600E or V600K mutation in this stage III trial (COMBO-AD, NCT01682083).
          792 (91%) patients had V600E, and were administered dabrafenib and trametinib
          or placebo for 12 months. In subsequent analysis, relapse or death occurred
          in 150/397 patients (38%) in the treatment group and 229/395 patients (58%)
          in the placebo group for a 95% CI Hazard Ratio of 0.48 (0.39-0.58).
        direction: supports
