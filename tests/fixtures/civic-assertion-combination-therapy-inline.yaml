      - description:
          In a clinical trial (NCT01597908) of 704 metastatic melanoma patients,
          patients harboring a BRAF V600E mutation and treated with vemurafenib (n=317)
          were associated with a 51% response rate, as compared to a 64% response rate
          (p<0.001) in V600E mutation positive patients treated with dabrafenib and
          trametinib combination therapy (n=312). Median progression-free survival was
          11.4 months in the combination-therapy group and 7.3 months in the vemurafenib
          group (hazard ratio, 0.56; 95% CI, 0.46 to 0.69; P<0.001).
        direction: supports
