description:
  Combination treatment of BRAF inhibitor dabrafenib and MEK inhibitor
  trametinib is recommended for adjuvant treatment of stage III or recurrent melanoma
  with BRAF V600E mutation detected by the approved THxID kit, as well as first
  line treatment for metastatic melanoma. The treatments are FDA approved based
  on studies including the Phase III COMBI-V, COMBI-D and COMBI-AD Trials. Combination
  therapy is now recommended above BRAF inhibitor monotherapy. Cutaneous squamous-cell
  carcinoma and keratoacanthoma occur at lower rates with combination therapy than
  with BRAF inhibitor alone.
direction: supports
