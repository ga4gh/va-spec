        type: Statement
      - description:
          "Afatinib is an irreversible covalent inhibitor of EGFR (second generation).
          This Phase III clinical trial (LUX-Lung 6; NCT01121393) was performed in Asian
          patients with EGFR mutant advanced NSCLC. 364 eligible patients with EGFR mutations
          were assigned to afatinib (n=242) or gemcitabine and cisplatin (n=122) treatment.
          The trial observed significantly longer median progression-free survival with
          afatinib vs. gemcitabine and cisplatin treatment (11.0 vs. 5.6 months). Afatinib/Chemotherapy
          group compositions: 51.2/50.8 % del 19; 38/37.7 % Leu858Arg; 10.8/11.5 % Uncommon."
        direction: supports
