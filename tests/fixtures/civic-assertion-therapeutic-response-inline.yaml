      - description:
          Cells harboring L858R were sensitive to afatinib. This study performed
          drug response assays using five human NSCLC cell lines with various combinations
          of EGFR mutations. In order to directly compare the sensitivity of multiple
          EGFR mutations to EGFR-TKIs the authors also generated multiple EGFR transduced
          Ba/F3 stable cell lines and evaluated sensitivity to EGFR-TKIs by MTS assay.
