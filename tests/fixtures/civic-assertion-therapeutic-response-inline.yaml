        type: Statement
      - description:
          In a phase 2 study of patients with lung adenocarcinoma (stage IIIb
          with pleural effusion or stage IV) and EGFR mutations, treated with afatinib
          were assessed by objective response. 129 patients were treated with afatinib.
          66% of the 106 patients with two common activating EGFR mutations (deletion
          19 or L858R) had an objective response compared to 39% of 23 patients with less
          common mutations.
