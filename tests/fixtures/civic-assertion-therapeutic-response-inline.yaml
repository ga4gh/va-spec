id: civic.aid:6
classification:
  name: Tier I
  primaryCoding:
    code: tier 1
    system: AMP/ASCO/CAP Guidelines, 2017
description:
  L858R is among the most common sensitizing EGFR mutations in NSCLC, and
  is assessed via DNA mutational analysis, including Sanger sequencing and next generation
  sequencing methods. Tyrosine kinase inhibitor afatinib is FDA approved as a first
  line systemic therapy in NSCLC with sensitizing EGFR mutation (civic.EID:2997).
direction: supports
hasEvidenceLines:
  - directionOfEvidenceProvided: supports
    hasEvidenceItems:
      - description:
          Afatinib, an irreversible inhibitor of the ErbB family of tyrosine
          kinases has been approved in the US for the first-line treatment of patients
          with metastatic non-small-cell lung cancer (NSCLC) who have tumours with EGFR
          exon 19 deletions or exon 21 (L858R) substitution mutations as detected by a
          US FDA-approved test
        direction: supports
        id: civic.eid:2997
        proposition:
