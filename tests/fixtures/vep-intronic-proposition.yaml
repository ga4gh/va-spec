type: VariantMolecularConsequenceProposition
subjectVariant: "#/my_focus_variant"
predicate: "hasMolecularConsequence"
objectConsequence:
  concepts:
    - name: intron_variant
      primaryCoding:
        code: "SO:0001627"
        system: "sequenceontology"
    - name: non_coding_transcript_variant
      primaryCoding:
        code: "SO:0001619"
        system: "sequenceontology"
    membershipOperator: "OR"
        
transcriptVariationContextQualifier: []
  # Problem: VRS alleles can't be defined on intronic or upstream/downstream regions. Otherwise, we would put:
  # - type: Allele
  #   expressions:
  #     - syntax: hgvs.c
  #       value: ENST00000811587.1:n.327-16745dup
  #   transcriptMolecule:
  #     id: ENST00000811587.1
  #     refgetAccession: SQ.Y2M5OWI4OGRiN2JkNGViYzQ2MjllMThk
  #     residueAlphabet: na
  #     type: SequenceReference
geneContextQualifier:
  primaryCoding:
    code: ENSG00000230515
    system: Ensembl-Gene
  extensions:
    - name: biotype
      value: lncRNA
    - name: strand
      value: -1
extensions:
  - name: impact
    value: MODIFIER
