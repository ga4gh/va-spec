  description:
    RET M918T is the most common somatically acquired mutation in medullary
    thyroid cancer (MTC). While there currently are no RET-specific inhibiting agents,
    promiscuous kinase inhibitors have seen some success in treating RET overactivity.
    Data suggests however, that the M918T mutation may lead to drug resistance,
    especially against the VEGFR-inhibitor motesanib. It has also been suggested
    that RET M918T leads to more aggressive MTC with a poorer prognosis.
