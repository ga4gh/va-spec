        type: Statement
      - description:
          Comprehensive molecular studies (through whole genome, whole exome,
          transcriptome sequencing, genome-wide copy number analysis, clustering analysis
          by DNA methylation profiling, mutation hotspot analysis by Sanger sequencing,
          and FISH) were performed in a cohort of 91 low-grade neuroepithelial tumors
          (LGNTs), including diffuse astrocytomas, angiocentric gliomas, gangliogliomas,
          dysembryoplastic neuroepithelial tumors, oligodendrogliomas, and oligoastrocytomas.
          Molecular alterations were detected in 31/32 (97%) of LGNTs with an astrocytic
          morphology, including 17 diffuse astrocytomas and 15 angiocentric gliomas, and
          no IDH mutations were detected in these tumors. MYB (n=5) or MYBL1 (n=2) rearrangements
          were detected in 41% (7/17) of diffuse astrocytomas, while the remaining tumors
          had alternations involving BRAF (n = 4), FGFR1/3 (n = 4), and others (n = 2).
          The gene partners involving MYB fusions in diffuse astrocytomas included PCDHGA1,
          LOC154902, and MMP16, and the gene partners involving MYBL1 included MMP16.
          In contrast, a MYB fusion (most frequently MYB::QKI) characterized almost all
          angiocentric gliomas (14 of 15). Only one other tumor across the series (an
          oligodendroglioma) had a MYB fusion (MYB::MAML2). MYB/MYBL-altered LGNTs clustered
          together with methylation profiling. The findings in LGNT with a predominantly
          astrocytic phenotype associating with MYB/MYBL alterations suggest a role of
          MYB/MYBL in these tumor categories with distinct characteristics.
