        type: Statement
      - description:
          Copy-number analysis was performed on 44 diffuse pediatric low-grade
          gliomas (PLGGs) to identify recurrent alterations. The most significant event,
          focal 8q13.1 gain, was observed in 28% (5/18) of diffuse astrocytoma grade IIs
          (DA2). All five DA2 samples with 8q focal gains exhibited a common centromeric
          breakpoint within MYBL1 after exon 9, resulting in partial duplication of MYBL1
          with truncation of its C-terminal negative-regulatory domain. Whole-genome sequencing
          of a MYBL1-rearranged DA2 demonstrated MYBL1 tandem duplication with the telomeric
          sequence located in MMP16. Truncated MYBL1 transcripts identified in this tumor
          induced anchorage-independent growth in 3T3 cells and tumor formation in nude
          mice. Truncated transcripts were also expressed in two additional DA2s with
          MYBL1 partial duplication. A similar recurrent deletion-truncation breakpoint
          was identified in two angiocentric gliomas (AGs) in the related gene MYB on
          6q23.3. The results define clinically relevant molecular subclasses of diffuse
          PLGGs and highlight a potential role for the MYB family in the biology of low-grade
          gliomas.
