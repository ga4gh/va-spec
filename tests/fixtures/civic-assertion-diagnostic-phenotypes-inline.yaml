id: civic.aid:115
classification:
  primaryCoding:
    code: tier 1
    name: Tier I
    system: AMP/ASCO/CAP (AAC) Guidelines, 2017
description:
  Diffuse astrocytoma, MYB- or MYBL1-altered is a rare, CNS WHO grade 1,
  diffusely infiltrative astroglial neoplasm with genetic alterations in MYB or MYBL1
  associated with epileptic seizures in children and adults. MYB and MYBL1 are closely
  related transcriptional transactivators that become upregulated when structural
  rearrangements result in truncation of the C-terminal negative-regulatory domain.
  Professional guidelines (WHO) list the presence of a structural MYB or MYBL1 variant
  or a DNA methylation profile meeting the appropriate calibrated score thresholds
  for diffuse astrocytoma, MYB- or MYBL1-altered as essential diagnostic criteria
  for diffuse astrocytoma, MYB- or MYBL1-altered (WHO classification of tumours series,
  5th ed.; vol. 7).
direction: supports
hasEvidenceLines:
  - directionOfEvidenceProvided: supports
    hasEvidenceItems:
      - description:
          "Histological, molecular, and clinical analysis of 26 histologically\
          \ prototypical isomorphic diffuse gliomas with a specific DNA methylation profile\
          \ distinct from other glial/glio-neuronal brain tumors and normal hemispheric\
          \ tissue were found to be most closely related to pediatric MYB/MYBL1-altered\
          \ diffuse astrocytomas and angiocentric gliomas. IDH1/2-wildtype status was\
          \ verified by Sanger sequencing of 24 cases with sufficient DNA. Integrating\
          \ copy number and RNA sequencing demonstrated MYBL1 (n=14) or MYB (n=6) alterations\
          \ in 77% (20/26) of these tumors. Nine tumors had MYBL1 rearrangements (including\
          \ one involving 5\u2019 of MYBL1) with various gene partners, including MMP16\
          \ (n=3), RAD51B (n=1), MAML2 (n=1), ZFHX4 (n=1), TOX (n=1), RP11-586K2.1 (intergenic\
          \ region) (n=1), and RP11492M23.2 (intergenic region) (n=1). These fusions resulted\
          \ in a deletion of the C-terminal negative regulatory C-myb domain of MYBL1.\
          \  Copy number analysis revealed gain or loss involving MYBL1 in 10 tumors,\
          \ including six with MYBL1 fusion and four without MYBL1 fusions detected. Increased\
          \ MYBL1 expression was observed in 71% (10/14) of the tumors with MYBL1 alterations."
