id: civic.aid:6
type: Statement
description: L858R is among the most common sensitizing EGFR mutations in NSCLC,
  and is assessed via DNA mutational analysis, including Sanger sequencing and next
  generation sequencing methods. Tyrosine kinase inhibitor afatinib is FDA approved
  as a first line systemic therapy in NSCLC with sensitizing EGFR mutation
  (civic.EID:2997).
