      - description:
          Afatinib, an irreversible inhibitor of the ErbB family of tyrosine
          kinases has been approved in the US for the first-line treatment of patients
          with metastatic non-small-cell lung cancer (NSCLC) who have tumours with EGFR
          exon 19 deletions or exon 21 (L858R) substitution mutations as detected by
          a US FDA-approved test
