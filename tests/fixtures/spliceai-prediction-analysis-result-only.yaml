- type: SequenceReference
  id: ENST00000366667.6
  refgetAccession: SQ.Y2M5OWI4OGRiN2JkNGViYzQ2MjllMThk
  residueAlphabet: na
# The primary score is the max of the four delta scores (DS_AG, DS_AL, DS_DG, DS_DL),
# which is the value conventionally used for thresholding (e.g., >= 0.5 = high impact).
score: 0.52
scoreType: SpliceAI max delta score
specifiedBy:
  name: SpliceAI
  type: Method
  methodType: variant effect predictor
  reportedIn:
