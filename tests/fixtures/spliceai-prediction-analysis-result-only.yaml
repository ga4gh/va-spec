# A standalone ComputationalVariantFunctionalImpactAnalysisResult for a SpliceAI prediction.
# SpliceAI produces four delta scores (DS) and four delta positions (DP) — one pair per
# splice-site event type (acceptor gain, acceptor loss, donor gain, donor loss).
# The primary score field holds the max delta score (the conventionally reported summary value),
# while ancillaryResults captures all eight per-event scores and positions, plus the gene symbol.
# This pattern is appropriate when the consumer only needs the raw analysis outputs
# without a formal assertion of truth about a proposition.
type: ComputationalVariantFunctionalImpactAnalysisResult
