    pmid: '30661751'
ancillaryResults:
  # Delta scores: probability of the variant altering each splice-site event type.
  # Values range from 0 to 1; higher values indicate greater predicted impact.
  DS_AG: 0.52   # acceptor gain
  DS_AL: 0.00   # acceptor loss
  DS_DG: 0.01   # donor gain
  DS_DL: 0.00   # donor loss
  # Delta positions: distance (in bp) from the variant to the affected splice site for each event.
  DP_AG: -26
  DP_AL: 0
  DP_DG: -26
  DP_DL: -29
  SYMBOL: AGT
