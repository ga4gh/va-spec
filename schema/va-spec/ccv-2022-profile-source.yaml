$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.1.0-ballot.2026-09.1/ccv-2022-profile-source.yaml"
title: CCV 2022 Variant Oncogenicity Profiles
description: >-
  Profiles defined to align with terminology and conventions from the Clinical Genome Resource (ClinGen),
  Cancer Genomics Consortium (CGC),and Variant Interpretation for Cancer Consortium (VICC) 2022 community
  guidelines for cancer variant interpretation.
strict: true
imports:
  va-spec: va-spec-source.yaml
  gkm-core: ../gkm-core/gkm-core-source.yaml

namespaces:
  va-spec: /ga4gh/schema/va-spec/1.1.0-ballot.2026-09.1/json/
  gkm.core: /ga4gh/schema/gkm-core/1.3.0-ballot.2026-09.1/json/

$defs:
  VariantOncogenicityStatement:
    maturity: draft
    description: >-
      A statement reporting a conclusion from a single study about whether a variant
      is associated with oncogenicity (positive or negative) - based on interpretation of the study's
      results.
    allOf:
      - $refCurie: va-spec:Statement
      - properties:
          proposition:
            oneOf:
              - $refCurie: va-spec:VariantOncogenicityProposition
              - $refCurie: gkm.core:iriReference
            description: >-
              A proposition about the oncogenicity of a variant, for which the study provides evidence.
              The validity of this proposition, and the level of confidence/evidence supporting it,
              may be assessed and reported by the Statement.
          strength:
            description: >-
              The strength of support that an CCV 2022 Oncogenicity statement is determined to provide
              for or against the proposed oncogenicity of the assessed variant. Strength is evaluated relative
              to the direction indicated by the 'direction' attribute. The indicated enumeration constrains the nested
              MappableConcept.primaryCoding > Coding.code attribute when capturing evidence strength.
              Conditional requirement: if direction is either 'supports' or 'disputes', then this
              attribute is required. If it is 'neutral', then this attribute is not allowed.
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gkm.core:Coding
                  - properties:
                      code:
                        enum:
                          - definitive
                          - likely
                      system:
                        const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
          classification:
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gkm.core:Coding
                  - properties:
                      code:
                        enum:
                          - oncogenic
                          - likely oncogenic
                          - uncertain significance
                          - likely benign
                          - benign
                      system:
                        const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
          specifiedBy:
            description: >-
              The method that specifies how the oncogenicity classification is ultimately assigned to the variant,
              based on assessment of evidence.
          hasEvidenceLines:
            type: array
            items:
              anyOf:
                - $ref: "#/$defs/VariantOncogenicityEvidenceLine"
                - $refCurie: gkm.core:iriReference
        required:
          - classification
          - specifiedBy

  VariantOncogenicityEvidenceLine:
    maturity: draft
    description: >-
      An Evidence Line that describes how evidence for a variant was interpreted to determine if a specific
      CCV 2022 criterion code is met, and the strength that evidence this provides for or against the variant's
      oncogenicity.
      An Evidence Line that describes how a specific type of information was interpreted as evidence for or against
      a variant's oncogenicity. In the CCV Framework, evidence is assessed by determining if a specific criterion
      (e.g. 'OM2') with a default strength (e.g. 'moderate') is 'met' or 'not met', and in some cases adjusting the
      default strength based on the quality and abundance of evidence.
    allOf:
      - $refCurie: va-spec:EvidenceLine
      - properties:
          targetProposition:
            description: >-
              A Variant Oncogenicity Proposition against which a specific type of evidence was assessed, to
              determine the strength and direction of support this evidence provides for or against the
              proposition's validity.
            oneOf:
              - $refCurie: va-spec:VariantOncogenicityProposition
              - $refCurie: gkm.core:iriReference
          strengthOfEvidenceProvided:
            description: >-
              The strength of support that an Evidence Line is determined to provide for or against the proposed
              oncogenicity of the assessed variant. Strength is evaluated relative to the direction indicated by
              the 'direction' attribute, and captured using a MappableConcept, whose
              nested 'code' field is bound to an enumerated set of values. Conditional requirement: if
              `direction` is either 'supports' or 'disputes', then this attribute is required.
              If it is 'neutral', then this attribute is not allowed.
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gkm.core:Coding
                  - properties:
                      code:
                        enum:
                          - standalone
                          - very strong
                          - strong
                          - moderate
                          - supporting
                      system:
                        const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
          specifiedBy:
            description: >-
              The guidelines or rubrics followed in interpreting evidence, to determine the strength and direction
              of support that it provides for or against a variant's oncogenicity. While the CCV Criteria themselves
              provide minimal guidance, typically a more detailed, gene- or cancer- specific rubric is followed
              to determine if a given criterion was met, and how strongly.
            properties:
              methodType:
                description: >-
                  A term representing the type of method used to assess evidence for or against the oncogenicity of a variant.
                  Method type is reported as the CCV Code that defines criteria against which evidence is assessed to determine
                  if it supports oncogenicity or benignity of a variant.
                type: string
                oneOf:
                  - const: population_data_assessment
                    description: >-
                      Assessment of whether population control frequency refutes
                      oncogenicity or whether absence/extreme rarity in controls provides
                      supporting evidence for oncogenicity.
                  - const: functional_data_assessment
                    description: >-
                      Assessment of well-established in vitro or in vivo functional
                      studies to determine whether experimental evidence supports or
                      refutes an oncogenic effect.
                  - const: primary_sequence_consequence_assessment
                    description: >-
                      Assessment of the primary sequence-level consequence of the variant,
                      including null/loss-of-function effects, protein-length changes,
                      stop-loss effects, or synonymous variants predicted to have no
                      splice or conservation impact.
                  - const: functional_domain_assessment
                    description: >-
                      Assessment of whether the variant occurs in a critical and
                      well-established functional domain or region, such as an enzyme
                      active site.
                  - const: amino_acid_analogy_assessment
                    description: >-
                      Assessment by analogy to previously established oncogenic variants,
                      including the same amino acid change or a different missense change
                      at the same residue.
                  - const: somatic_hotspot_assessment
                    description: >-
                      Assessment of somatic recurrence at cancer hotspots or recurrently
                      mutated residues, with evidence strength based on recurrence
                      thresholds.
                  - const: in_silico_impact_assessment
                    description: >-
                      Aggregate assessment of computational predictions, including
                      conservation, missense-effect, and splice-effect tools, supporting
                      either oncogenic effect or no effect.
                  - const: single_genetic_etiology_assessment
                    description: >-
                      Assessment of whether the variant occurs in a gene and malignancy
                      context where the disease has a single genetic etiology, making that
                      gene-level event supportive of oncogenicity.
            required:
              - methodType
              - reportedIn
          evidenceOutcome:
            description: >-
              The evidence outcome provides a single string that summarizes 'direction' and
              'strength' assessments, along with the specific CCV criterion used in these assessments.
              Rules for constructing this string are as follows, and enforced by a regex constraint:
              (1) If a criterion is met and its default strength is not altered, the outcome is simply the criterion
              code (e.g. 'OM2' when the OM2 criteria is met with moderate strength);
              (2) If a criterion is met and its default strength is altered, the outcome is the criterion code plus the
              altered strength value (e.g. 'OS2_moderate' when OS2 is met with an adjusted moderate strength);
              (3)  If a specific criterion was assessed but not met, the outcome is the criterion code plus '_not_met'
              (e.g. 'OS2_not_met');
              (4)  If the criteria associated with the 'methodType' were assessed, but none were met, the outcome is
              'no_criteria_met'.
            properties:
              primaryCoding:
                code:
                  pattern: "^(?:no_criteria_met|((?:OVS1|SBVS1)(?:_(?:not_met|(?:strong|moderate|supporting)))?|(?:OS[1-3]|SBS[1-2])(?:_(?:not_met|(?:very_strong|moderate|supporting)))?|(?:OM[1-4])(?:_(?:not_met|(?:very_strong|strong|supporting)))?|(OP[1-4]|SBP[1-2])(?:_(?:not_met|very_strong|strong|moderate))?))$"
                  example: OS3_moderate, OS3_not_met, OVS1, SBVS1_not_met, no_criteria_met
                system:
                  const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
      - if:
          properties:
            directionOfEvidenceProvided:
              enum: [supports, disputes]
          required: [directionOfEvidenceProvided]
        then:
          required: [strengthOfEvidenceProvided]
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: population_data_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|(SBVS1|SBS1|OP4)(_.+)?)$"
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: functional_data_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|(OS2|SBS2)(_.+)?)$"
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: primary_sequence_consequence_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|(OVS1|OM2|SBP2)(_.+)?)$"
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: functional_domain_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|OM1(_.+)?)$"
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: amino_acid_analogy_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|(OS1|OM4)(_.+)?)$"
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: somatic_hotspot_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|(OS3|OM3|OP3)(_.+)?)$"
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: in_silico_impact_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|(OP1|SBP1)(_.+)?)$"
      - if:
          properties:
            specifiedBy:
              properties:
                methodType:
                  const: single_genetic_etiology_assessment
              required: [methodType]
          required: [specifiedBy]
        then:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|OP2(_.+)?)$"
      - if:
          properties:
            evidenceOutcome:
              properties:
                primaryCoding:
                  properties:
                    code:
                      pattern: "^(?:no_criteria_met|(?:[A-Z]+[0-9]+)_not_met)$"
                  required: [code]
              required: [primaryCoding]
          required: [evidenceOutcome]
        then:
          properties:
            directionOfEvidenceProvided:
              const: neutral
          not:
            required: [strengthOfEvidenceProvided]
    required:
      - directionOfEvidenceProvided
      - specifiedBy
