$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/ccv-2022/oncogenicity-study-statement-profile-source.yaml"
title: Clingen/CCG/VICC 2022 Variant Oncogenicity Study Statement
strict: true

imports:
  va-core: ../base/va-core-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  VariantOncogenicityStudyStatement:
    maturity: draft
    description: >-
      A statement reporting a conclusion from a single study about whether a variant
      is associated with oncogenicity (positive or negative) - based on interpretation of the study's
      results.
    allOf:
    - $ref: "/ga4gh/schema/gks-core/1.0.0-snapshot.2025-02/json/Statement"
    - properties:
        proposition:
          $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantOncogenicityProposition"
          description: >-
            A proposition about the oncogenicity of a varaint, for which the study provides evidence.
            The validity of this proposition, and the level of confidence/evidence supporting it,
            may be assessed and reported by the Statement.
