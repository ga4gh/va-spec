$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.1.0-snapshot.2026-02.1/ccv-2022/profile-source.yaml"
title: CCV 2022 Variant Oncogenicity Profiles
description: >-
  Profiles defined to align with terminology and conventions from the Clinical Genome Resource (ClinGen),
  Cancer Genomics Consortium (CGC),and Variant Interpretation for Cancer Consortium (VICC) 2022 community
  guidelines for cancer variant interpretation.
strict: true

imports:
  va-core: ../base/va-core-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  VariantOncogenicityStatement:
    maturity: draft
    description: >-
      A statement reporting a conclusion from a single study about whether a variant
      is associated with oncogenicity (positive or negative) - based on interpretation of the study's
      results.
    allOf:
    - $ref: "/ga4gh/schema/va-spec/1.1.0-snapshot.2026-02.1/base/json/Statement"
    - properties:
        proposition:
          $ref: "/ga4gh/schema/va-spec/1.1.0-snapshot.2026-02.1/base/json/VariantOncogenicityProposition"
          description: >-
            A proposition about the oncogenicity of a variant, for which the study provides evidence.
            The validity of this proposition, and the level of confidence/evidence supporting it,
            may be assessed and reported by the Statement.
        strength:
          description: >-
            The strength of support that an CCV 2022 Oncogenicity statement is determined to provide
            for or against the proposed oncogenicity of the assessed variant. Strength is evaluated relative
            to the direction indicated by the 'direction' attribute. The indicated enumeration constrains the nested
            MappableConcept.primaryCoding > Coding.code attribute when capturing evidence strength.
            Conditional requirement: if directionOfEvidenceProvided is either 'supports' or 'disputes', then this
            attribute is required. If it is 'neutral', then this attribute is not allowed.
          properties:
            primaryCoding:
              code:
                enum:
                  - definitive
                  - likely
              system:
                const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
        classification:
          properties:
            primaryCoding:
              code:
                enum:
                  - oncogenic
                  - likely oncogenic
                  - uncertain significance
                  - likely benign
                  - benign
              system:
                const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
        specifiedBy:
          description: >-
            The method that specifies how the oncogenicity classification is ultimately assigned to the variant,
            based on assessment of evidence.
      required:
        - classification
        - specifiedBy

  VariantOncogenicityEvidenceLine:
    maturity: draft
    description: >-
      An Evidence Line that describes how evidence for a variant was interpreted to determine if a specific
      CCV 2022 criterion code is met, and the strength that evidence this provides for or against the variant's
      oncogenicity.
      An Evidence Line that describes how a specific type of information was interpreted as evidence for or against
      a variant's oncogenicity. In the CCV Framework, evidence is assessed by determining if a specific criterion
      (e.g. 'OM2') with a default strength (e.g. 'moderate') is 'met' or 'not met', and in some cases adjusting the
      default strength based on the quality and abundance of evidence.
    allOf:
    - $ref: "/ga4gh/schema/va-spec/1.1.0-snapshot.2026-02.1/base/json/EvidenceLine"
    - properties:
        targetProposition:
          description: >-
            A Variant Oncoogenicity Proposition against which a specific type of evidence was assessed, to
            determine the strength and direction of support this evidence provides for or against the
            proposition's validity.
          $ref: "/ga4gh/schema/va-spec/1.1.0-snapshot.2026-02.1/base/json/VariantOncogenicityProposition"
        directionOfEvidenceProvided:
          type: string
          enum: [ "supports", "neutral", "disputes" ]
          description: >-
            The direction of support that the Evidence Line is determined to provide toward its target Proposition
            (supports, disputes, neutral). For CCV-based assessments, if a oncogenicity criterion is 'met' in the
            Evidence Line the direction is 'supports', if a benignity criterion is 'met' the direction is 'disputes',
            and if a criteria is 'not met' the direction is 'none'.
        strengthOfEvidenceProvided:
          description: >-
            The strength of support that an Evidence Line is determined to provide for or against the proposed
            oncogenicity of the assessed variant. Strength is evaluated relative to the direction indicated by
            the 'directionOfEvidenceProvided' attribute, and captured using a MappableConcept, whose
            nested 'code' field is bound to an enumerated set of values. Conditional requirement: if
            `directionOfEvidenceProvided` is either 'supports' or 'disputes', then this attribute is required.
            If it is 'none', then this attribute is not allowed.
          properties:
            primaryCoding:
              code:
                enum:
                  - standalone
                  - very strong
                  - strong
                  - moderate
                  - supporting
              system:
                const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
        specifiedBy:
          description: >-
            The guidelines or rubrics followed in interpreting evidence, to determine the strength and direction
            of support that it provides for or against a variant's oncogenicity. While the CCV Criteria themselves
            provide minimal guidance, typically a more detailed, gene- or cancer- specific rubric is followed
            to determine if a given criterion was met, and how strongly.
          methodType:
            description: >-
              A term representing the type of method used to assess evidence for or against the oncogenicity of a variant.
              Method type is reported as the CCV Code that defines criteria against which evidence is assessed to determine
              if it supports oncogenicity or benignity of a variant.
            type: string
            enum:
              - OVS1
              - OS1
              - OS2
              - OS3
              - OM1
              - OM2
              - OM3
              - OM4
              - OP1
              - OP2
              - OP3
              - OP4
              - SBVS1
              - SBS1
              - SBS2
              - SBP1
              - SBP2
          required:
            - methodType
            - reportedIn
        evidenceOutcome:
          description: >-
            The evidence outcome provides a single string that summarizes 'directionOfEvidenceProvided' and
            'strengthOfEvidenceProvided' assessments, along with the specific CCV criterion used in these assessments.
            Rules for constructing this string are as follows, and enforced by a regex constraint:
            (1) If a criterion is met and its default strength is not altered, the outcome is simply the criterion
            code (e.g. 'OM2' when the OM2 criteria is met with moderate strength);
            (2) If a criterion is met and its default strength is altered, the outcome is the criterion code plus the
            altered strength value (e.g. 'OS2_moderate' when OS2 is met with an adjusted moderate strength);
            (3)  If a criterion is not met, the outcome is the criterion code plus the string 'not_met' (e.g. 'OS2_not_met').
          properties:
            primaryCoding:
              code:
                pattern: '^((?:OVS1|SBVS1)(?:_(?:not_met|(?:strong|moderate|supporting)))?|(?:OS[1-3]|SBS[1-2])(?:_(?:not_met|(?:very_strong|moderate|supporting)))?|(?:OM[1-4])(?:_(?:not_met|(?:very_strong|strong|supporting)))?|(OP[1-4]|SBP[1-2])(?:_(?:not_met|very_strong|strong|moderate))?)$'
                example: OS3_moderate, OS3_not_met, OVS1, SBVS1_not_met
              system:
                const: ClinGen/CGC/VICC Guidelines for Oncogenicity, 2022
    - if:
        properties:
          directionOfEvidenceProvided:
            enum: [supports, disputes]
        required: [directionOfEvidenceProvided]
      then:
        required: [strengthOfEvidenceProvided]
    required:
      - directionOfEvidenceProvided
      - specifiedBy
