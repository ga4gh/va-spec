$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/base/prognostic-study-statement-profile-source.yaml"
title: Variant Prognostic Study Statement Standard Profile
strict: true

imports:
  va-prog-prop: ./prognostic-study-proposition-profile-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  # Variant Prognostic Study Statement
  VariantPrognosticStudyStatement:
    inherits: gks-core:Statement
    type: object
    maturity: draft
    description: >-
      A Statement reporting a conclusion from a single study about whether a variant
      is associated with an improved or worse outcome for a disease - based on
      interpretation of the study's results.
    properties:
      type:
        extends: type
        const: "VariantPrognosticStudyStatement"
        default: "VariantPrognosticStudyStatement"
        description: MUST be "VariantPrognosticStudyStatement".
      proposition:
        extends: proposition
        $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantPrognosticStudyProposition"
        description: >-
          The proposition for which the study provides evidence - that the subject variant
          is associated with the object disease outcome.
    required:
      - proposition
