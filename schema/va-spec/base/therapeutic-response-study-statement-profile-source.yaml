$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/base/therapeutic-response-study-statement-profile-source.yaml"
title: Variant Therapeutic Response Study Statement Standard Profile
strict: true

imports:
  va-tr-prop: ./therapeutic-response-study-proposition-profile-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  # Variant Therapeutic Response Study Statement
  VariantTherapeuticResponseStudyStatement:
    inherits: gks-core:Statement
    maturity: draft
    type: object
    description: >-
      A Statement reporting a conclusion from a single study about the role of a variant
      in modulating the response of a neoplasm to drug administration or other therapeutic
      procedures - based on interpretation of the study's results.
    properties:
      type:
        extends: type
        const: "VariantTherapeuticResponseStudyStatement"
        default: "VariantTherapeuticResponseStudyStatement"
        description: MUST be "VariantTherapeuticResponseStudyStatement".
      proposition:
        extends: proposition
        # LB: should this be a oneOf and include the option for an IRI reference?
        $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantTherapeuticResponseStudyProposition"
        description: >-
          Reports the conclusion of the study, which is that the subject variant is
          associated with therapeutic sensitivity or resistance to the object therapeutic.
      
