$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/profiles/assay-var-effect-source.yaml"
title: VA Spec Molecular Consequence statement result Profiles
strict: true

imports:
  va-core: ./va-core-source.yaml
  cat-vrs: ../../cat-vrs/cat-vrs-source.yaml
  vrs: ../../vrs/vrs-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  # In Silico Tool Study Result
  InSilicoVariantEffectScoreStudyResult:
      inherits: va-core:StudyResult
      maturity: draft
      type: object
      description: >-
        A StudyResult that reports a variant effect score from a predictive algorithm.
      properties:
        type:
          extends: type
          const: "InSilicoVariantEffectScoreStudyResult"
          default: "InSilicoVariantEffectScoreStudyResult"
          description: MUST be "InSilicoVariantEffectScoreStudyResult".
        label:
          type: string
          description: A primary name for the score
        focusVariant:
          extends: focus
          oneOf: 
            - $refCurie: gks.core:iriReference
            - $refCurie: vrs:Allele
          description: The variant for which this annotation applies to.
        transcripts:
          type: array
          ordered: false
          items:
            oneOf:
              - $refCurie: gks.core:iriReference
              - $refCurie: vrs:SequenceReference
          description: Transcripts for which this score is applicable
        score:
          type: number
          description: The score of the variant effect.
        ancillaryResults:
          type: object
          description: Dictionary of any normalized or ancillary scores (e.g., the CADD Phred score)
        sourceDataSet:
          description: >-
            The full data set that this measurement is a part of
          extends: sourceDataSet

  # In Silico Tool Evidence Line
  InSilicoVariantEffectPredictionEvidenceLine:
      inherits: va-core:EvidenceLine
      maturity: draft
      type: object
      description: >-
        An EvidenceLine that reports a variant effect prediction from a functional assay.
      properties:
        type:
          extends: type
          const: "InSilicoVariantEffectPredictionEvidenceLine"
          default: "InSilicoVariantEffectPredictionEvidenceLine"
          description: MUST be "InSilicoVariantEffectPredictionEvidenceLine".
        targetProposition:
          $ref: "#/$defs/Proposition"
          description: >-
            The possible fact against which evidence items contained in an Evidence Line were collectively evaluated. This
            will likely be a statement of pathogenicity or oncogenicity.
        hasEvidenceItems:
          type: array
          ordered: false
          items:
            anyOf:
              - $ref: "#/$defs/InSilicoVariantEffectScoreStudyResult"
              - $refCurie: gks.core:iriReference
          description: >-
            An individual piece of information that was evaluated as evidence in building the argument represented
            by an Evidence Line. This should always be an InSilicoVariantEffectScoreStudyResult.
        directionOfEvidenceProvided:
          type: string
          enum: [ "supports", "neutral", "disputes" ]
          description: >-
            The direction of support that the Evidence Line is determined to provide toward its target Proposition
            (supports, disputes, neutral)

  # In Silico Tool Proposition
  InSilicoVariantEffectPredictionProposition:
    inherits: SubjectVariantProposition
    maturity: draft
    type: object
    description: >-
      A Proposition describing the predicted impact of a variant based on variant effect predictors. 
    properties:
      type:
        extends: type
        const: "InSilicoToolPredictedImpactProposition"
        default: "InSilicoToolPredictedImpactProposition"
        description: MUST be "InSilicoToolPredictedImpactProposition".
      predicate:
        extends: predicate
        description: >-
          The relationship the Proposition describes between the subject variant
          and object impact.
        default: impactsFunctionOf
      objectTranscript:
        extends: object
        oneOf:
          - $refCurie: gks.core:iriReference
          - $refCurie: gks.core:MappableConcept
        description: >-
          The transcript on whose function the impact of the subject variant is reported.
      toolContextQualifier:
        description: >-
          The tools that were used to evaluate this proposition.
        anyOf:
          - $refCurie: gks.core:iriReference
          - $ref: "#/$defs/MappableConcept"
          - type: object
            additionalProperties: true
    required:
      - predicate
      - objectImpact

  # In Silico Tool Statement
  InSilicoVariantEffectPredictionStatement:
    type: object
    inherits: Statement
    maturity: draft
    description: >-
      An Statement asserting functional impact on a transcript based on the predictions of an in silico tool  
    properties:
      type:
        extends: type
        const: InSilicoVariantEffectPredictionStatement
        default: InSilicoVariantEffectPredictionStatement
        description: MUST be "InSilicoVariantEffectPredictionStatement".
      proposition:
        $ref: "#/$defs/Proposition"
        description:  >-
          The InSilicoVariantEffectPredictionProposition for which we are making the statement.
      direction:
        description: >-
          A term indicating whether the Statement supports, disputes, or remains neutral w.r.t. the validity of the
          Proposition it evaluates.
        type: string
        enum:
          - supports
          - neutral
          - disputes
      classification:
        $refCurie: gks.core:MappableConcept
        description: >-
          A single term or phrase summarizing the outcome of direction and strength
          assessments of a Statement's Proposition, in terms of a classification of
          its subject.
        $comment: >-
          If an in silico tool provides its own classification along with the accompanying score (e.g., SIFT), 
          the value will be stored here.
      hasEvidenceLines:
        type: array
        ordered: false
        items:
          anyOf:
            - $ref: "#/$defs/EvidenceLine"
            - $refCurie: gks.core:iriReference
        description: >-
          InSilicoVariantEffectPredictionEvidenceLine objects that supportthe validity of this Statement.
    required:
      - proposition
      - direction
