$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/base/x-variant-prognostic-study-profile-source.yaml"
title: Variant Prognostic Study Base Profiles
strict: true

imports:
  domain-entities: ./domain-entities-source.yaml
  cat-vrs: ../../cat-vrs/cat-vrs-source.yaml
  vrs: ../../vrs/vrs-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  # Variant Prognostic Study Proposition
  XVariantPrognosticStudyProposition:
    inherits: gks-core:Proposition
    type: object
    maturity: draft
    description: >-
      A Proposition reporting a conclusion from a single study about whether a variant
      is associated with an improved or worse outcome for a disease - based on
      interpretation of the study's results.
    properties:
      type:
        extends: type
        const: "VariantPrognosticStudyProposition"
        default: "VariantPrognosticStudyProposition"
        description: MUST be "VariantPrognosticStudyProposition".
      subjectVariant:
        extends: subject
        oneOf:
        - $ref: "/ga4gh/schema/vrs/2.x/json/Variation"
        - $ref: "/ga4gh/schema/cat-vrs/1.x/json/CategoricalVariant"
        - $ref: "/ga4gh/schema/gks-core/1.x/json/iriReference"
        description: A variant that is the subject of the Proposition.
      predicate:
        extends: predicate
        enum:
        - associatedWithBetterOutcomeFor
        - associatedWithWorseOutcomeFor
      objectCondition:
        extends: object
        oneOf:
        - $ref: "/ga4gh/schema/va-spec/1.x/base/json/Condition"
        - $ref: "/ga4gh/schema/gks-core/1.x/json/iriReference"
        description: The disease that is evaluated for outcome.
      alleleOriginQualifier:
        type: string
        description: >-
          Reports whether the proposition should be interpreted in the context of an inherited
          (germline) variant, an acquired (somatic) mutation, or both (combined).
        enum:
        - germline
        - somatic
        - combined
      allelePrevalenceQualifier:
        type: string
        description: >-
          Reports whether the proposition should be interpreted in the context of the variant
          being rare or common.
        enum:
        - rare
        - common
      geneContextQualifier:
        description: >-
          Reports a gene impacted by the variant, which may contribute to the
          prognostic association  in the Proposition.
        $ref: "/ga4gh/schema/gks-core/1.x/json/MappableConcept"
    required:
      - subjectVariant
      - predicate
      - objectCondition

  # Variant Prognostic Study Statement
  XVariantPrognosticStudyStatement:
    inherits: gks-core:Statement
    type: object
    maturity: draft
    description: >-
      A Statement reporting a conclusion from a single study about whether a variant
      is associated with an improved or worse outcome for a disease - based on
      interpretation of the study's results.
    properties:
      type:
        extends: type
        const: "VariantPrognosticStudyStatement"
        default: "VariantPrognosticStudyStatement"
        description: MUST be "VariantPrognosticStudyStatement".
      proposition:
        extends: proposition
        $ref: "#/$defs/XVariantPrognosticStudyProposition"
        description: >-
          The proposition for which the study provides evidence - that the subject variant
          is associated with the object disease outcome.
    required:
      - proposition