$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/base/diagnostic-study-statement-profile-source.yaml"
title: Variant Dx Study Statement Standard Profile
strict: true

imports:
  va-dx-prop: ./diagnostic-study-proposition-profile-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml
  
$defs:
  # Variant Diagnostic Study Statement
  VariantDiagnosticStudyStatement:
    inherits: gks-core:Statement
    type: object
    maturity: draft
    description: >-
      A Statement reporting a conclusion from a single study about whether a variant
      is associated with a disease (a diagnostic inclusion criterion), or absence of a
      disease (diagnostic exclusion criterion) - based on interpretation of the study's
      results.
    properties:
      type:
        extends: type
        const: "VariantDiagnosticStudyStatement"
        default: "VariantDiagnosticStudyStatement"
        description: MUST be "VariantDiagnosticStudyStatement".
      proposition:
        extends: proposition
        $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantDiagnosticStudyProposition"
        description: >-
          The proposition for which the study provides evidence - that the subject variant
          is associated with the object disease.          
    required:
    - proposition