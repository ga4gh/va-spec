$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.0.0-ballot.2024-11.1/base/2-cohort-allele-frequency-study-result-profile-source.yaml"
title: Cohort Allele Frequency Study Result Standard Profile
strict: true

imports:
  va-core: ./va-core-source.yaml
  vrs: ../../vrs/vrs-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

namespaces:
  gks.core: /ga4gh/schema/gks-core/1.0.0-snapshot.2024-11.2/json/
  vrs: /ga4gh/schema/vrs/2.0.0-ballot.2024-11.1/json/
  cat-vrs: /ga4gh/schema/cat-vrs/1.0.0-ballot.2024-11.1/json/

$defs:
  CohortAlleleFrequencyStudyResult:
    inherits: va-core:StudyResult
    maturity: trial use
    type: object
    description: >-
      A StudyResult that reports measures related to the frequency of an Allele in a cohort
    properties:
      type:
        extends: type
        const: "CohortAlleleFrequencyStudyResult"
        default: "CohortAlleleFrequencyStudyResult"
        description: MUST be "CohortAlleleFrequencyStudyResult".
      sourceDataSet:
        extends: sourceDataSet 
        description: The dataset from which the CohortAlleleFrequencyStudyResult was reported.
      focusAllele:
        extends: focus
        description: The Allele for which frequency results are reported.
        oneOf:
        - $refCurie: vrs:Allele
        - $refCurie: gks.core:iriReference
      focusAlleleCount:
        type: integer
        description: The number of occurrences of the focusAllele in the cohort.
      locusAlleleCount:
        type: integer
        description: >-
          The number of occurrences of all alleles at the locus in the cohort.
      focusAlleleFrequency:
        type: number
        description: The frequency of the focusAllele in the cohort.
      cohort:
        $ref: StudyGroup
        description: The cohort from which the frequency was derived.
      subCohortFrequency:
        type: array
        ordered: false
        description: >-
          A list of CohortAlleleFrequency objects describing subcohorts of the cohort currently being described.
          Subcohorts can be further subdivided into more subcohorts. This enables, for example, the description 
          of different ancestry groups and sexes among those ancestry groups.
        items:
          $ref: "#/$defs/CohortAlleleFrequencyStudyResult"
      ancillaryResults:
        maturity: draft
        $comment: >-
          This field is left at draft maturity, as it is different from most GKS objects by allowing any content 
          to be added.
        type: object
        additionalProperties: true
      qualityMeasures:
        maturity: draft
        $comment: >-
          This field is left at draft maturity, as it is different from most GKS objects by allowing any content 
          to be added.
        type: object
        additionalProperties: true
    required:
    - focusAllele
    - focusAlleleCount
    - locusAlleleCount
    - focusAlleleFrequency
    - cohort
