$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.0.1/base/domain-entities-source.yaml"
title: VA Spec Shared Domain Entity Data Structures
strict: true

imports:
  gks-core: ../../gks-core/gks-core-source.yaml

namespaces:
  gks.core: /ga4gh/schema/gks-core/1.1.0/json/

$defs:
  # Condition data structure for defining single conditions as an extension of MappableConcept
  Condition:
    maturity: trial use
    description: >-
      A concept representing a single condition (disease, phenotype, or trait).
    $comment: >-
      At present, individual conditions are represented using a MappableConcept that captures a code or name
      for the condition, along with optional mappings and metadata about the code system. Groups of conditions are represented
      using the ConditionSet class, which are collections of 2 or more conditions, each represented as a MappableConcept.
      By convention, cases where no condition is given by the data provider SHOULD be specified using a MappableConcept with
      a conceptType = "Absent". Additionally, either the 'name' or 'primaryCoding' attribute of a MappableConcept must
      be populated.  The name or code may simple reiterate the conceptType (e.g. 'condition absent'), or report a more specific
      nature or reason for the absence of a condition (e.g. 'Data Missing in Source', 'Condition Unknown', 'All Mendelian Diseases').
    allOf:
      - $refCurie: gks.core:MappableConcept
      - properties:
          conceptType:
            anyOf:
              - enum: [Condition, Phenotype, Disease, Trait, Absent]
              - type: string
            default: Condition

  # ConditionSet data structure to provide support for co-occurring or substitute conditions.
  ConditionSet:
    maturity: trial use
    description: >-
      A set of conditions (diseases, phenotypes, traits) that occur together or are
      related, depending on the membership operator, and may manifest together in the
      same patient or individually in a different subset of participants in a research
      study.
    $comment: >-
      The membershipOperator `OR` should be used only in the specific scenario where a study is done on a cohort of individuals
      that manifest only one of the conditions in the set. Conclusions about this condition are determined based on an aggregate
      statistical analysis across all members of this mixed cohort – because the study does not provide the statistical power to
      make a conclusion about each condition individually. In such cases, it would be misleading to create separate statements
      about each condition on its own.
      Conditions in such groups are typically related in their etiology or manifestation, and patients are pooled to make a single
      cohort that is large enough support a statistically significant results about this grouping of related conditions.
    allOf:
      - $refCurie: gks.core:ConceptSet
      - properties:
          concepts:
            type: array
            ordered: false
            items:
              oneOf:
                - $ref: "#/$defs/Condition"
                - $ref: "#/$defs/ConditionSet"

  # Therapy data structure for defining single therapies as an extension of MappableConcept
  Therapy:
    maturity: trial use
    description: >-
      An individual therapy (drug, procedure, behavioral intervention, etc.)
    $comment: >-
      At present, individual therapies are represented using this specialization of MappableConcept, that captures a code or name
      for the therapy, along with optional mappings and metadata about the code system. Groups of therapies are represented using
      the TherapyGroup class, which are collections of 2 or more therapies, each represented as a MappableConcept.
    allOf:
      - $refCurie: gks.core:MappableConcept
      - properties:
          conceptType:
            anyOf:
              - enum: [Therapy, Absent, Drug, Procedure, Behavioral Intervention]
              - type: string
            default: Therapy

  # TherapyGroup data structure to provide support for combination therapies (i.e. drug treatment, etc.)
  TherapyGroup:
    maturity: trial use
    description: >-
      A group of two or more therapies that are applied in combination to a single patient/subject, or applied
      individually to a different subset of participants in a research study.
    $comment: >-
      The membershipOperator value 'AND' indicates that all therapies in the group were applied in combination
      to a given patient or subject. The value 'OR' indicates that each therapy was applied individually to a distinct
      subset of participants in the cohort that was interrogated in a given study.
      `OR` should be used only in the specific scenario where a study is done on a cohort of individuals
      that receive one of the therapies in the group - and the treatment response is determined based on an aggregate statistical
      analysis across all members of this mixed cohort. In such cases, the study does not provide the statistical power to make a
      conclusion about response to each therapy individually.
      Therapies in such groups are typically related in their treatment mechanism (e.g. members of the same drug class), and recipients
      are pooled to make a single cohort that is large enough support a statistically significant results about that class of treatments.
      Future iterations of the VA-Spec may support representation of these categorical groupings of therapies, but for now we capture the
      individual therapies used in the study in a TherapyGroup.
    allOf:
    - $refCurie: gks.core:ConceptSet
    - properties:
        concepts:
          type: array
          ordered: false
          items:
            oneOf:
              - $ref: "#/$defs/Therapy"
              - $ref: "#/$defs/TherapyGroup"
