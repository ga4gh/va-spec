$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.0.1/base/domain-entities-source.yaml"
title: VA Spec Shared Domain Entity Data Structures
strict: true

imports:
  gks-core: ../../gks-core/gks-core-source.yaml

namespaces:
  gks.core: /ga4gh/schema/gks-core/1.1.0/json/

$defs:
  # Generic class that can hold a single or a set of Mappabale Concepts of any kind
  ConceptOrConceptSet:
    maturity: draft
    description: >-
    oneOf:
      - $refCurie: gks.core:MappableConcept
      - $ref: "#/$defs/ConceptSet"
      A single domain concept, or a set of concept (ConceptSet).
    $comment: >-
      Individual concepts are represented using the MappableConcept class, which supports optional mappings and metadata
      about the code system. Sets of concepts are represented using the ConceptSet class, which is an array of 2 or more 
      MappableConcept objects.
      
  # A ConceptSet data structure to provide support for sets of generic concepts.
  ConceptSet:
    type: object
    maturity: draft
    inherits: gks-core:Element
    description: >-
      A set of concepts that may be considered as dependent (occurring together), or independent (existing separately)
      in the context of some knowledge reported about them, as indicated by a set membership operator. e.g. a set of independent
      molecular consequences that both result from the presence of a particular genetic variant (membership operator = OR).
    properties:
      concepts:
        type: array
        ordered: false
        items:
          oneOf:
            - $refCurie: gks.core:MappableConcept
            - $ref: "#/$defs/ConceptSet"
        description: >-
          A list of concepts that are dependent (occurring together), or independent (existing separately), depending on the
          membership operator.
        minItems: 2
      membershipOperator:
        description: >-
          The logical relationship between concepts in the set, in the context of some knowledge reported about them.
          The value 'AND' indicates that the concepts are dependent and occur together in this context.
          The value 'OR' indicates that each concept applies independently in this context.
        type: string
        enum:
           - AND
           - OR
    required:
      - concepts
      - membershipOperator

  # Condition data structure for consolidating the different forms of conditions, individual vs co-occurring traits
  Condition:
    maturity: trial use
    inherits: ConceptOrConceptSet
    description: >-
      A single condition (disease, phenotype, or trait), or a set of conditions (ConditionSet).
    $comment: >-
      At present, individual conditions are represented using a MappableConcept that captures a code or name for the
      condition, along with optional mappings and metadata about the code system. Groups of conditions are represented
      using the ConditionSet class, which are collections of 2 or more conditions, each represented as a MappableConcept.
      By convention, cases where no condition is given by the data provider SHOULD be specified using a MappableConcept with
      a conceptType = "Absent". Additionally, either the 'name' or 'primaryCoding' attribute of a MappableConcept must
      be populated.  The name or code may simple reiterate the conceptType (e.g. 'condition absent'), or report a more specific
      nature or reason for the absence of a condition (e.g. 'Data Missing in Source', 'Condition Unknown', 'All Mendelian Diseases').
    oneOf:
      - $refCurie: gks.core:MappableConcept
      - $ref: "#/$defs/ConditionSet"

  # ConditionSet data structure to provide support for co-occurring or substitute conditions.
  ConditionSet:
    type: object
    inherits: ConceptSet
    maturity: trial use
    inherits: gks-core:Element
    description: >-
      A set of conditions (diseases, phenotypes, traits) that occur together or are
      related, depending on the membership operator, and may manifest together in the
      same patient or individually in a different subset of participants in a research
      study.
    properties:
      conditions:
        extends: concepts
        type: array
        ordered: false
        items:
          oneOf:
            - $refCurie: gks.core:MappableConcept
            - $ref: "#/$defs/ConditionSet"
        description: >-
          A list of conditions (diseases, phenotypes, traits) that are co-occurring or
          related, depending on the membership operator.
        minItems: 2
      membershipOperator:
        extends: membershipOperator
        description: >-
          The logical relationship between conditions in the set, that indicates how they manifest in patients/research subjects.
          The value 'AND' indicates that all conditions in the set co-occur together in a given patient or subject.
          The value 'OR' indicates that only one condition in the set manifests in each participant interrogated in a given study.
        type: string
        enum:
           - AND
           - OR
        $comment: >-
          The membershipOperator `OR` should be used only in the specific scenario where a study is done on a cohort of individuals
          that manifest only one of the conditions in the set. Conclusions about this condition are determined based on an aggregate
          statistical analysis across all members of this mixed cohort – because the study does not provide the statistical power to
          make a conclusion about each condition individually.  In such cases, it would be misleading to create separate statements
          about each condition on its own.
          Conditions in such groups are typically related in their etiology or manifestation, and patients are pooled to make a single
          cohort that is large enough support a statistically significant results about this grouping of related conditions.
    required:
      - conditions
      - membershipOperator
      
  # Therapeutic
  Therapeutic:
    inherits: ConceptOrConceptSet
    maturity: trial use
    description: >-
      An individual therapy (drug, procedure, behavioral intervention, etc.), or group of therapies (TherapyGroup).
    $comment: >-
      At present, individual therapies are represented using a MappableConcept that captures a code or name for the therapy,
      along with optional mappings and metadata about the code system. Groups of therapies are represented using the
      TherapyGroup class, which are collections of 2 or more therapies, each represented as a MappableConcept.
    oneOf:
      - $refCurie: gks.core:MappableConcept
      - $ref: "#/$defs/TherapyGroup"

  # TherapyGroup data structure to provide support for combination therapies (i.e. drug treatment, etc.)
  TherapyGroup:
    extends: ConceptSet
    type: object
    maturity: trial use
    inherits: gks-core:Element
    description: >-
      A group of two or more therapies that are applied in combination to a single patient/subject, or applied
      individually to a different subset of participants in a research study.
    properties:
      therapies:
        extends: concepts
        type: array
        ordered: false
        items:
          $refCurie: gks.core:MappableConcept
        description: >-
          A list of therapies that are applied to treat a condition.
        minItems: 2
      membershipOperator:
        extends: membershipOperator
        description: >-
          The logical relationship between therapies in the group, that indicates how they were applied in treating
          participants in a study.  The value 'AND' indicates that all therapies in the group were applied in combination
          to a given patient or subject. The value 'OR' indicates that each therapy was applied individually to a distinct
          subset of participants in the cohort that was interrogated in a given study.
        type: string
        enum:
           - AND
           - OR
        $comment: >-
          The membershipOperator `OR` should be used only in the specific scenario where a study is done on a cohort of individuals
          that receive one of the therapies in the group - and the treatment response is determined based on an aggregate statistical
          analysis across all members of this mixed cohort. In such cases, the study does not provide the statistical power to make a
          conclusion about response to each therapy individually.
          Therapies in such groups are typically related in their treatment mechanism (e.g. members of the same drug class), and recipients
          are pooled to make a single cohort that is large enough support a statistically significant results about that class of treatments.
          Future iterations of the VA-Spec may support representation of these categorical groupings of therapies, but for now we capture the
          individual therapies used in the study in a TherapyGroup.
    required:
      - therapies
      - membershipOperator
