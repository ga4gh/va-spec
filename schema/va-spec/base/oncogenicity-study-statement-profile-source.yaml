$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/base/oncogenicity-study-statement-profile-source.yaml"
title: Variant Oncogenicity Study Statement Standard Profile
strict: true

imports:
  va-onc-prop: ./oncogenicity-study-proposition-profile-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml
  
$defs:
  # Variant Oncogenicity Study Statement
  VariantOncogenicityStudyStatement:
    inherits: gks-core:Statement
    maturity: draft
    type: object
    description: >-
      A Statement reporting a conclusion from a single study that supports or refutes a
      variant's effect on oncogenesis for a specific tumor type - based on interpretation
      of the study's results.
    properties:
      type:
        extends: type
        const: "VariantOncogenicityStudyStatement"
        default: "VariantOncogenicityStudyStatement"
        description: MUST be "VariantOncogenicityStudyStatement".
      proposition:
        extends: proposition
        $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantOncogenicityStudyProposition"
        description: >-
          The proposition for which the study provides evidence - that the subject variant
          is associated with the object tumor type.
    required:
      - proposition