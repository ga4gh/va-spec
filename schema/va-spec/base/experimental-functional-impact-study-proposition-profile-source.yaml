$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/base/experimental-functional-impact-study-proposition-profile-source.yaml"  
title: Experimental Variant Functional Impact Study Proposition
strict: true

imports:
  cat-vrs: ../../cat-vrs/cat-vrs-source.yaml
  vrs: ../../vrs/vrs-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  ExperimentalVariantFunctionalImpactStudyProposition:
    inherits: gks-core:Proposition
    maturity: draft
    type: object
    description: >-
      A proposition reporting a conclusion from a single assay or study about the functional
      impact of a variant on a sequence feature (typically a gene or gene product).
    properties:
      type:
        extends: type
        const: "ExperimentalVariantFunctionalImpactStudyProposition"
        default: "ExperimentalVariantFunctionalImpactStudyProposition"
        description: MUST be "ExperimentalVariantFunctionalImpactStudyProposition".
      subjectVariant:
        extends: subject
        oneOf:
          - $ref: "/ga4gh/schema/vrs/2.x/json/MolecularVariation"
          - $ref: "/ga4gh/schema/cat-vrs/1.x/json/CategoricalVariant"
          - $ref: "/ga4gh/schema/gks-core/1.x/json/iriReference"
        description: A protein or genomic contextual or canonical molecular variant.
      predicate:  
        extends: predicate
        description: >-
          The relationship this Proposition describes between the subject Variant
          and object Sequence Feature whose function it may alter.
        const: impactsFunctionOf                
      objectSequenceFeature:
        extends: object
        oneOf:
          - $ref: "/ga4gh/schema/gks-core/1.x/json/iriReference"
          - $ref: "/ga4gh/schema/gks-core/1.x/MappableConcept"      # See https://github.com/ga4gh/gks-common/pull/77 - proposes a SequenceFeature domain entity class
        description: >-
          The sequence feature (typically a gene or gene product) on whose function the impact 
          of the subject variant is assessed.
      studyContextQualifier:
        description: >-
          The assay in which the reported variant functional impact was determined - 
          providing a specific experimental context in which this effect is asserted to hold.
        $comment: >-
          The attribute is required in order to explicitly specify an assay or study context in
          which the reported impact was observed. It's value can be a Document object, or an IRI 
          pointing to a document that describes the assay/study. This may be a publication, a
          database record, or a bespoke document.
        oneOf:
          - $ref: "/ga4gh/schema/gks-core/1.x/json/Document"
          - $ref: "/ga4gh/schema/gks-core/1.x/json/iriReference"
      impactTypeQualifier:           # This qualifier allows more specific types of impacts to be reported - so the profile supports implementations like CIViC, ClinGen, and I think even some MAVE data.
        description: >-
          A term describing a specific type of functional impact that the variant is determined
          to have on the indicated sequence feature (e.g. decreased activity, dominant negative,
          neomorphic, reduced Ca2+ binding activity).
        $comment: >-
          Implementers may use a set of terms to use here that reflect the specific types of
          functional impact(s) measured by the assay(s) employed. It is recommended that terms
          are drawn from established terminologies where possible.
          
        # Matt: At some point we should standardize to a set of permissible values. We could do this from the outset, based on early adopter needs, and growing from there. Or leave unconstrained initially and constrain later.
        # I seeded an initial proposal that covers specific impact types used in MAVE and CIViC. Note that application/community specific terms these adopters want to use can be captured in the 'classification' slot.
        # Note also that if there is a way to constrain permissible values when using the MappableConcept pattern, we could do that instead of an enum here. 
        type: string                 
        enum:
          - increased activity/function              # maps to CIViC 'gain of function'
          - decreased activity/function              # maps to CIViC 'loss of function'
          - novel activity/function                  # maps to CIViC 'neomorphic'
          - dominant negative activity/function      # maps to CIViC 'dominant negative'
    required:
      - subjectVariant
      - predicate
      - objectSequenceFeature
      - studyContextQualifier
