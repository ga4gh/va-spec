$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/base/pathogenicity-statement-profile-source.yaml"
title: Variant Pathogenicity Statement Standard Profile
strict: true

imports:
  va-path-prop: ./pathogenicity-proposition-profile-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  # Variant Pathogenicity Statement
  VariantPathogenicityStatement:
    type: object
    maturity: draft
    inherits: gks-core:Statement
    description: >-
      A Statement describing the role of a variant in causing an inherited condition.
    properties:
      type:
        extends: type
        const: "VariantPathogenicityStatement"
        default: "VariantPathogenicityStatement"
        description: MUST be "VariantPathogenicityStatement".
      proposition:
        extends: proposition
        $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantPathogenicityProposition"
        description: >-
          The proposition that the subject variant is associated with the object disease.
      classification:
        extends: classification
        properties:
            label:
              type: string
              enum:
                - pathogenic
                - likely pathogenic
                - uncertain significance
                - likely benign
                - benign
    required:
      - proposition
      - classification
