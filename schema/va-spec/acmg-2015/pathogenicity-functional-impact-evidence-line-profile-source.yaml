$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/acmg-2015/pathogenicity-functional-impact--profile-source.yaml"
title: ACMG 2015 Variant Pathogenicity Functional Impact Evidence Line Profile
strict: true

imports:
  va-core: ../base/va-core-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  VariantPathogenicityFunctionalImpactEvidenceLine:
    maturity: draft
    description: >-
      An Evidence Line that describes how information about the functional impact of a variant on a gene or
      gene product was interpreted as evidence for or against the variant's pathogenicity.
    allOf:
    - $ref: "/ga4gh/schema/gks-core/1.0.0-snapshot.2025-02/json/EvidenceLine"
    - properties:
        targetProposition:
          description: >-
            A Variant Pathogenicity Proposition against which functional impact information was assessed,
            in determining the strength and direction of support this information provides as evidence.
          $ref: "/ga4gh/schema/va-spec/1.0.0-snapshot.2025-02/base/json/VariantPathogenicityProposition"
        strengthOfEvidenceProvided:
          description: >-
            The strength of support that an Evidence Line is determined to provide for or against the
            proposition or the pathogenicity of the assessed variant. Strength is evaluated relative to
            the direction indicated by the directionOfEvidenceProvided attribute.
            *Conditional requirement: if directionOfEvidenceProvided is either 'supports' or 'disputes',
            then this attribute is required. If it is 'none', then this attribute is not allowed.
          properties:
            primaryCoding:
              code:
                enum:
                  - strong
                  - moderate
                  - supporting
              system:
                const: ga4gh-gks-term:path-functional-impact-strengthOfEvidenceProvided
        specifiedBy:
          description: >-
            The ACMG criterion that was applied to interpret variant functional impact information
            as evidence for or against the assessed variant's pathogenicity.
          properties:
            primaryCoding:
              description: >-
                The ACMG 2015 criterion code that was applied to interpret variant functional impact information
                as evidence for or against the assessed variant's pathogenicity.  Must be one of the following values: BS3 or PS3.
                Conditional requirement:
                * If directionOfEvidenceProvided is 'supports' then the value must be 'PS3'.
                * If directionOfEvidenceProvided is 'disputes' then the value must be 'BS3'.
              code:
                enum:
                  - PS3
                  - BS3
              system:
                const: ga4gh-gks-term:path-functional-impact-specifiedBy
        evidenceOutcome:
          description: >-
            The evidence outcome is a summary of the 'directionOfEvidenceProvided', 'strengthOfEvidenceProvided' and 'specifiedBy' values.
            The 'specifiedBy' attribute is required and assumed to have a single method, BS3 or PS3. if 'directionOfEvidenceProvided' 'none',
            then the outcome is 'not met'. If 'directionOfEvidenceProvided' is 'supports' or 'disputes', then the outcome is 'met' along with
            the strength of evidence provided.
          properties:
            primaryCoding:
              code:
                enum:
                  - PS3
                  - PS3_moderate
                  - PS3_supporting
                  - PS3_not_met
                  - BS3
                  - BS3_moderate
                  - BS3_supporting
                  - BS3_not_met
              system:
                const: ga4gh-gks-term:path-functional-impact-evidenceOutcome
    required:
      - directionOfEvidenceProvided
      - specifiedBy
