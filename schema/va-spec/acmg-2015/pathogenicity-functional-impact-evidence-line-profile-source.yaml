$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/acmg-2015/pathogenicity-functional-impact--profile-source.yaml"
title: ACMG 2015 Variant Pathogenicity Functional Impact Evidence Line Profile
strict: true

imports:
  va-base: ../base/pathogenicity-proposition-profile-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  VariantPathogenicityFunctionalImpactEvidenceLine:
    maturity: draft
    description: >-
      An Evidence Line providing information about the functional impact of a variant on a gene or gene product.
    allOf:
    - $ref: "/ga4gh/schema/gks-core/1.x/json/EvidenceLine"
    - properties:
        targetProposition:
          description: >-
            The proposition for which the evidence line provides support - that the subject variant
            impacts the function of the object sequence feature.
          $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantPathogenicityProposition"
        strengthOfEvidenceProvided:           # TO DO: Ensure that the enum below covers terms needed for initial adopters. Merge https://github.com/ga4gh/gks-core/pull/78 which updates the core IM to allow this property to take a string so we can define the enum here. Think about if we need the 'PS'/'BS' parts of enum value labels - as this bakes in direction, and is duplicative as the 'specifiedBy' attribute reports the ACMG criterion applied. 
          type: string                       
          enum:
            - Strong
            - Moderate
            - Supporting
          description: >-
            The strength of support that an Evidence Line is determined to provide for or against
            the pathogenicity of the assessed variant. Strength is evaluated relative to the direction
            indicated by the directionOfEvidenceProvided attribute.            
        specifiedBy:
          description: >-
            The ACMG criterion that was applied to interpret the functional impact of the variant
            on the gene or gene product.
          properties:
            label:
              type: string
              enum:
                - ACMG 2015 PS3 Criterion
                - ACMG 2015 BS3 Criterion
    required:
      - strengthOfEvidenceProvided
      - specifiedBy
