$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/acmg-2015/pathogenicity-functional-impact--profile-source.yaml"
title: ACMG 2015 Variant Pathogenicity Functional Impact Evidence Line Profile
strict: true

imports:
  va-core: ../base/va-core-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  VariantPathogenicityFunctionalImpactEvidenceLine:
    maturity: draft
    description: >-
      An Evidence Line that describes how information about the functional impact of a variant on a gene or
      gene product was interpreted as evidence for or against the variant's pathogenicity.
    allOf:
    - $ref: "/ga4gh/schema/gks-core/1.0.0-snapshot.2025-02.2/json/EvidenceLine"
    - properties:
        targetProposition:
          description: >-
            A Variant Pathogenicity Proposition against which functional impact information was assessed,
            in determining the strength and direction of support this information provides as evidence.
          $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantPathogenicityProposition"
        strengthOfEvidenceProvided:
          description: >-
            The strength of support that an Evidence Line is determined to provide for or against the proposed
            pathogenicity of the assessed variant. Strength is evaluated relative to the direction indicated by
            the 'directionOfEvidenceProvided' attribute. The indicated enumeration constrains the nested 
            MappableConcept.primaryCoding > Coding.code attribute when capturing evidence strength. 
            Conditional requirement: if directionOfEvidenceProvided is either 'supports' or 'disputes', then this
            attribute is required. If it is 'none', then this attribute is not allowed. 
          properties:
            primaryCode:
              type: string
              enum:
                - strong
                - moderate
                - supporting
        specifiedBy:
          description: >-
            The ACMG criterion that was applied to interpret variant functional impact information
            as evidence for or against the assessed variant's pathogenicity.
          properties:
            primaryCode:
              description: >-
                The ACMG 2015 criterion code that was applied to interpret variant functional impact information
                as evidence for or against the assessed variant's pathogenicity.  Must be one of the following values: BS3 or PS3.
                Conditional requirement:
                * If directionOfEvidenceProvided is 'supports' then the value must be 'PS3'.
                * If directionOfEvidenceProvided is 'disputes' then the value must be 'BS3'.
              type: string
              enum:
                - PS3
                - BS3
        evidenceOutcome:
          description: >-
            The evidence outcome is a summary of the 'directionOfEvidenceProvided' and 'strengthOfEvidenceProvided' values, 
            along with the specific ACMG criterion code used in these assessments. The indicated enumeration constrains the 
            nested MappableConcept.primaryCoding > Coding.code attribute to capture evidence outcomes. Note that if 
            'directionOfEvidenceProvided' is 'none', then the evidence outcome is 'not met' for the relevant criterion
            (e.g. 'PS3_not_met'). If 'directionOfEvidenceProvided' is 'supports' or 'disputes', then the outcome is 'met' for
            the relevant criterion, along with the strength of evidence provided. (e.g. 'PS3_moderate').
          properties:
            primaryCode:
              type: string
              enum:
                - PS3
                - PS3_moderate
                - PS3_supporting
                - PS3_not_met
                - BS3
                - BS3_moderate
                - BS3_supporting
                - BS3_not_met
    required:
      - directionOfEvidenceProvided
      - specifiedBy
