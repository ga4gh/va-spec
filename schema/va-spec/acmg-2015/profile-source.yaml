$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.0.1/acmg-2015/profile-source.yaml"
title: ACMG 2015 Variant Pathogenicity Profiles
description: >-
  Profiles defined to align with terminology and conventions from the American College of Medical Genetics
  and Genomics (ACMG) 2015 guidelines for interpretation of sequence variant pathogenicity.
strict: true

imports:
  va-core: ../base/va-core-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  # Variant Pathogenicity Statement
  VariantPathogenicityStatement:
    maturity: draft
    description: >-
      A Statement describing the role of a variant in causing an inherited condition.
    allOf:
    - $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/Statement"
    - properties:
        proposition:
          $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantPathogenicityProposition"
          description: >-
            A proposition about the pathogenicity of a variant, the validity of which is assessed and reported by the Statement.
            A Statement can put forth the proposition as being true, false, or uncertain, and may provide an assessment of the
            level of confidence/evidence supporting this claim.
        strength:
          description: >-
            The strength of support that an ACMG 2015 Variant Pathogenicity statement is determined to provide
            for or against the proposed pathogenicity of the assessed variant. Strength is evaluated relative
            to the direction indicated by the 'direction' attribute. The indicated enumeration constrains the nested
            MappableConcept.primaryCoding > Coding.code attribute when capturing evidence strength.
          properties:
            primaryCoding:
              code:
                enum:
                  - definitive
                  - likely
              system:
                const: ACMG Guidelines, 2015
          required: [primaryCoding]
        classification:
          description: >-
            The classification of the variant's pathogenicity, based on the ACMG 2015 guidelines.
            These classifications should coincide with the direction and strength values as follows:
            'pathogenic' with supports-strong, 'likely pathogenic' with supports-moderate,
            'benign' with disputes-strong, 'likely benign' with disputes-moderate 'uncertain significance'
            can be one of three possibilities... supports-weak, disputes-weak or neutral for
            uncertain significance (favoring pathogenic), uncertain significance (favoring benign) or
            uncertain significance (favoring neither pathogenic nor benign).
            The 'low penetrance' and 'risk allele' versions of pathogenicity classifications would be
            applied based on whether the variant proposition was defined to have a 'penetrance' of
            'low' or 'risk' respectively.
          properties:
            primaryCoding:
              allOf:
                - $ref: "/ga4gh/schema/gks-core/1.1.0/json/Coding"
                - oneOf:
                  - properties:
                      code:
                        enum:
                          - pathogenic
                          - likely pathogenic
                          - benign
                          - likely benign
                          - uncertain significance
                      system:
                        const: ACMG Guidelines, 2015
                  - properties:
                      code:
                        enum:
                          - pathogenic, low penetrance
                          - likely pathogenic, low penetrance
                          - established risk allele
                          - likely risk allele
                          - uncertain risk allele
                      system:
                        const: ClinGen Low Penetrance and Risk Allele Recommendations, 2024
        specifiedBy:
          description: >-
            The method that specifies how the pathogenicity classification is ultimately assigned to the variant,
            based on assessment of evidence.
        hasEvidenceLines:
          type: array
          items:
            $ref: "#/$defs/VariantPathogenicityEvidenceLine"
      required:
        - classification
        - specifiedBy

  VariantPathogenicityEvidenceLine:
    maturity: draft
    description: >-
      An Evidence Line that describes how a specific type of information was interpreted as evidence for or against
      a variant's pathogenicity. In the ACMG Framework, evidence is assessed by determining if a specific criterion
      (e.g. 'PM2') with a default strength (e.g. 'moderate') is 'met' or 'not met', and in some cases adjusting the
      default strength based on the quality and abundance of evidence.
    allOf:
    - $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/EvidenceLine"
    - properties:
        targetProposition:
          description: >-
            A Variant Pathogenicity Proposition against which a specific type of evidence was assessed, to
            determine the strength and direction of support this evidence provides for or against the
            proposition's validity.
          $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantPathogenicityProposition"
        directionOfEvidenceProvided:
          type: string
          enum: [ "supports", "neutral", "disputes" ]
          description: >-
            The direction of support that the Evidence Line is determined to provide toward its target Proposition
            (supports, disputes, neutral). For ACMG-based assessments, if a pathogenicity criterion is 'met' in the
            Evidence Line the direction is 'supports', if a benignity criterion is 'met' the direction is 'disputes',
            and if a criteria is 'not met' the direction is 'none'.
        strengthOfEvidenceProvided:
          description: >-
            The strength of support that an Evidence Line is determined to provide for or against the proposed
            pathogenicity of the assessed variant. Strength is evaluated relative to the direction indicated by
            the 'directionOfEvidenceProvided' attribute, and captured using a MappableConcept, whose
            nested 'code' field is bound to an enumerated set of values. Conditional requirement: if
            `directionOfEvidenceProvided` is either 'supports' or 'disputes', then this attribute is required.
            If it is 'none', then this attribute is not allowed.
          properties:
            primaryCoding:
              code:
                enum:
                  - standalone
                  - very strong
                  - strong
                  - moderate
                  - supporting
              system:
                const: ACMG Guidelines, 2015
        specifiedBy:
          description: >-
            The guidelines or rubrics followed in interpreting evidence, to determine the strength and direction
            of support that it provides for or against a variant's pathogenicity. While the ACMG Criteria themselves
            provide minimal guidance, typically a more detailed, disease- or gene- specific rubric is followed to
            determine if a given criterion was met, and how strongly (e.g. the ClinGen Hearing Loss Expert Panel
            guidelines for ACMG interpretations).
          methodType:
            description: >-
              A term representing the type of method used to assess evidence for or against the pathogenicity of a variant.
              Method type is reported as the ACMG Code that defines criteria against which evidence is assessed to determine
              if it supports pathogenicity or benignity of a variant.
            type: string
            enum:
              - PVS1
              - PS1
              - PS2
              - PS3
              - PS4
              - PM1
              - PM2
              - PM3
              - PM4
              - PM5
              - PM6
              - PP1
              - PP2
              - PP3
              - PP4
              - PP5
              - BA1
              - BS1
              - BS2
              - BS3
              - BS4
              - BP1
              - BP2
              - BP3
              - BP4
              - BP5
              - BP6
              - BP7
          required:
            - methodType
            - reportedIn
        evidenceOutcome:
          description: >-
            The evidence outcome provides a single string that summarizes 'directionOfEvidenceProvided' and
            'strengthOfEvidenceProvided' assessments, along with the specific ACMG criterion used in these assessments.
            Rules for constructing this string are as follows, and enforced by a regex constraint:
            (1) If a criterion is met and its default strength is not altered, the outcome is simply the criterion
            code (e.g. 'PM2' when the PM2 criteria is met with moderate strength);
            (2) If a criterion is met and its default strength is altered, the outcome is the criterion code plus the
            altered strength value (e.g. 'PS3_moderate' when PS3 is met with an adjusted moderate strength);
            (3)  If a criterion is not met, the outcome is the criterion code plus the string 'not_met' (e.g. 'PS3_not_met').
          properties:
            primaryCoding:
              code:
                pattern: '^((?:PVS1)(?:_(?:not_met|(?:strong|moderate|supporting)))?|(?:PS[1-4]|BS[1-4])(?:_(?:not_met|(?:very_strong|moderate|supporting)))?|BA1(?:_not_met)?|(?:PM[1-6])(?:_(?:not_met|(?:very_strong|strong|supporting)))?|(PP[1-5]|BP[1-7])(?:_(?:not_met|very_strong|strong|moderate))?)$'
                example: PS3, PS3_moderate, PS3_not_met, BP6, BP6_strong, BP6_not_met
                description: >-
                  The code for the evidence outcome, which is based on the ACMG criterion code, used,
                  and the assessed direction and strength of evidence provided.
              system:
                const: ACMG Guidelines, 2015
    - if:
        properties:
          directionOfEvidenceProvided:
            enum: [supports, disputes]
        required: [directionOfEvidenceProvided]
      then:
        required: [strengthOfEvidenceProvided]
    required:
      - directionOfEvidenceProvided
      - specifiedBy
