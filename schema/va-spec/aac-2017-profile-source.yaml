$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.1.0-ballot.2026-09.1/aac-2017-profile-source.yaml"
title: AAC 2017 Profiles
description: >-
  Profiles defined to align with terminology and conventions from the Association for Molecular Pathology (AMP),
  American Society of Clinical Oncology (ASCO), and College of American Pathologists (CAP) 2017 guidelines for the
  interpretation and reporting of sequence variants in cancer.
strict: true
imports:
  va-spec: va-spec-source.yaml
  gkm-core: ../gkm-core/gkm-core-source.yaml

namespaces:
  va-spec: /ga4gh/schema/va-spec/1.1.0-ballot.2026-09.1/json/
  gkm.core: /ga4gh/schema/gkm-core/1.3.0-ballot.2026-09.1/json/

$defs:
  AmpAscoCapStatement:
    maturity: draft
    description: General statement for AMP/ASCO/CAP
    allOf:
      - $refCurie: va-spec:Statement
      - properties:
          proposition:
            oneOf:
              - $refCurie: va-spec:VariantPrognosticProposition
              - $refCurie: va-spec:VariantDiagnosticProposition
              - $refCurie: va-spec:VariantTherapeuticResponseProposition
              - $refCurie: gkm.core:iriReference
          strength:
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gkm.core:Coding
                  - properties:
                      code:
                        enum: [A, B, C, D]
                      system:
                        const: AMP/ASCO/CAP Guidelines, 2017
    required: [proposition]

  PrognosticStatement:
    maturity: draft
    description: Prognostic statement for AMP/ASCO/CAP
    allOf:
      - $ref: "#/$defs/AmpAscoCapStatement"
      - properties:
          proposition:
            oneOf:
              - $refCurie: va-spec:VariantPrognosticProposition
              - $refCurie: gkm.core:iriReference

        required: [proposition]

  DiagnosticStatement:
    maturity: draft
    description: Diagnostic statement for AMP/ASCO/CAP
    allOf:
      - $ref: "#/$defs/AmpAscoCapStatement"
      - properties:
          proposition:
            oneOf:
              - $refCurie: va-spec:VariantDiagnosticProposition
              - $refCurie: gkm.core:iriReference
        required: [proposition]

  TherapeuticStatement:
    maturity: draft
    description: Therapeutic statement for AMP/ASCO/CAP
    allOf:
      - $ref: "#/$defs/AmpAscoCapStatement"
      - properties:
          proposition:
            oneOf:
              - $refCurie: va-spec:VariantTherapeuticResponseProposition
              - $refCurie: gkm.core:iriReference
        required: [proposition]

  VariantClinicalSignificanceStatement:
    maturity: draft
    description: >-
      A statement reporting a conclusion from a single study about the clinical
      significance of a variant with respect to a condition, based on interpretation of
      the study's results.
    allOf:
      - $refCurie: va-spec:Statement
      - properties:
          proposition:
            oneOf:
              - $refCurie: va-spec:VariantClinicalSignificanceProposition
              - $refCurie: gkm.core:iriReference
          strength:
            description: >-
              The strength of support that the Statement is determined to provide for or against the Variant Clinical Significance Proposition
              for the assessed variant, based on the curation and reporting conventions of the AMP/ASCO/CAP 2017
              Guidelines.
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gkm.core:Coding
                  - properties:
                      code:
                        enum:
                          - strong
                          - potential
                      system:
                        const: AMP/ASCO/CAP Guidelines, 2017
          outcome:
            description: >-
              A single term or phrase classifying the subject variant based on the outcome of direction and strength assessments of
              the Statement's Proposition, using terms from the AMP/ASCO/CAP 2017 Guidelines.
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gkm.core:Coding
                  - properties:
                      code:
                        enum:
                          - tier i
                          - tier ii
                          - tier iii
                          - tier iv
                      system:
                        const: AMP/ASCO/CAP Guidelines, 2017
        required:
          - outcome
          - specifiedBy
      - if:
          properties:
            outcome:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier i
                  required: [code]
              required: [primaryCoding]
          required: [outcome]
        then:
          properties:
            hasEvidenceLines:
              type: array
              items:
                anyOf:
                  - $refCurie: gkm.core:iriReference
                  - $ref: "#/$defs/DiagnosticStatement"
                  - $ref: "#/$defs/PrognosticStatement"
                  - $ref: "#/$defs/TherapeuticStatement"
            outcome:
              type: object
              properties:
                name:
                  const: Tier I
              required: [name]
            strength:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: strong
                  required: [code]
              required: [primaryCoding]
            direction:
              const: supports
          required: [outcome, strength, direction]
      - if:
          properties:
            outcome:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier ii
                  required: [code]
              required: [primaryCoding]
          required: [outcome]
        then:
          properties:
            hasEvidenceLines:
              type: array
              items:
                anyOf:
                  - $refCurie: gkm.core:iriReference
                  - $ref: "#/$defs/DiagnosticStatement"
                  - $ref: "#/$defs/PrognosticStatement"
                  - $ref: "#/$defs/TherapeuticStatement"
            outcome:
              type: object
              properties:
                name:
                  const: Tier II
              required: [name]
            strength:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: potential
                  required: [code]
              required: [primaryCoding]
            direction:
              const: supports
          required: [outcome, strength, direction]
      - if:
          properties:
            outcome:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier iii
                  required: [code]
              required: [primaryCoding]
          required: [outcome]
        then:
          properties:
            outcome:
              type: object
              properties:
                name:
                  const: Tier III
              required: [name]
            strength: false
            direction:
              const: neutral
          required: [outcome, direction]
      - if:
          properties:
            outcome:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier iv
                  required: [code]
              required: [primaryCoding]
          required: [outcome]
        then:
          properties:
            outcome:
              type: object
              properties:
                name:
                  const: Tier IV
              required: [name]
            strength: false
            direction:
              const: disputes
          required: [outcome, direction]
