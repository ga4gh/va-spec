$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.x/aac-2017/prognostic-study-statement-profile-source.yaml"
title: Variant Prognostic Study Statement Profile (AAC 2017)
description: >-
  Profile defined to align with terminology and conventions from the Association for Molecular Pathology (AMP),
  American Society of Clinical Oncology (ASCO), and College of American Pathologists (CAP) 2017 guidelines for the
  interpretation and reporting of sequence variants in cancer. 
strict: true

imports:
  va-core: ../base/va-core-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

$defs:
  VariantPrognosticStudyStatement:
    maturity: draft
    description: >-
      A statement reporting a conclusion from a single study about whether a variant
      is associated with a disease prognosis - based on interpretation of the study's
      results.
    allOf:
    - $ref: "/ga4gh/schema/va-spec/1.x/base/json/Statement"
    - properties:
        proposition:
          $ref: "/ga4gh/schema/va-spec/1.x/base/json/VariantPrognosticProposition"
          description: >-
            A proposition about a prognostic association between a variant and condition, for which the study provides
            evidence. The validity of this proposition, and the level of confidence/evidence supporting it,
            may be assessed and reported by the Statement.
