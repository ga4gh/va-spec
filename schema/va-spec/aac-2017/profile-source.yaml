$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/ga4gh/schema/va-spec/1.0.1/aac-2017/profile-source.yaml"
title: AAC 2017 Profiles
description: >-
  Profiles defined to align with terminology and conventions from the Association for Molecular Pathology (AMP),
  American Society of Clinical Oncology (ASCO), and College of American Pathologists (CAP) 2017 guidelines for the
  interpretation and reporting of sequence variants in cancer.
strict: true
imports:
  va-core: ../base/va-core-source.yaml
  gks-core: ../../gks-core/gks-core-source.yaml

namespaces:
  gks.core: /ga4gh/schema/gks-core/1.1.0/json/

$defs:
  AmpAscoCapEvidenceLine:
    maturity: draft
    description: Evidence line for AMP/ASCO/CAP
    allOf:
      - $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/EvidenceLine"
      - properties:
          targetProposition:
            oneOf:
              - $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantPrognosticProposition"
              - $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantDiagnosticProposition"
              - $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantTherapeuticResponseProposition"
          strengthOfEvidenceProvided:
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gks.core:Coding
                  - properties:
                      code:
                        enum: [A, B, C, D]
                      system:
                        const: AMP/ASCO/CAP Guidelines, 2017
    required: [targetProposition]

  PrognosticEvidenceLine:
    maturity: draft
    type: array
    ordered: false
    description: Prognostic evidence line for AMP/ASCO/CAP
    items:
      anyOf:
        - allOf:
          - $ref: "#/$defs/AmpAscoCapEvidenceLine"
          - properties:
              targetProposition:
                $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantPrognosticProposition"
            required: [targetProposition]
        - $ref: "/ga4gh/schema/gks-core/1.1.0/json/iriReference"

  DiagnosticEvidenceLine:
    maturity: draft
    type: array
    ordered: false
    description: Diagnostic evidence line for AMP/ASCO/CAP
    items:
      anyOf:
        - allOf:
          - $ref: "#/$defs/AmpAscoCapEvidenceLine"
          - properties:
              targetProposition:
                $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantDiagnosticProposition"
            required: [targetProposition]
        - $ref: "/ga4gh/schema/gks-core/1.1.0/json/iriReference"

  TherapeuticEvidenceLine:
    maturity: draft
    type: array
    ordered: false
    description: Therapeutic evidence line for AMP/ASCO/CAP
    items:
      anyOf:
        - allOf:
          - $ref: "#/$defs/AmpAscoCapEvidenceLine"
          - properties:
              targetProposition:
                $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantTherapeuticResponseProposition"
            required: [targetProposition]
        - $ref: "/ga4gh/schema/gks-core/1.1.0/json/iriReference"

  VariantClinicalSignificanceStatement:
    maturity: draft
    description: >-
      A statement reporting a conclusion from a single study about the clinical
      significance of a variant with respect to a condition, based on interpretation of
      the study's results.
    allOf:
      - $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/Statement"
      - properties:
          proposition:
            $ref: "/ga4gh/schema/va-spec/1.0.1/base/json/VariantClinicalSignificanceProposition"
          strength:
            description: >-
              The strength of support that the Statement is determined to provide for or against the Variant Clinical Significance Proposition
              for the assessed variant, based on the curation and reporting conventions of the AMP/ASCO/CAP 2017
              Guidelines.
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gks.core:Coding
                  - properties:
                      code:
                        enum:
                          - strong
                          - potential
                      system:
                        const: AMP/ASCO/CAP Guidelines, 2017
          classification:
            description: >-
              A single term or phrase classifying the subject variant based on the outcome of direction and strength assessments of
              the Statement's Proposition, using terms from the AMP/ASCO/CAP 2017 Guidelines.
            properties:
              primaryCoding:
                allOf:
                  - $refCurie: gks.core:Coding
                  - properties:
                      code:
                        enum:
                          - tier i
                          - tier ii
                          - tier iii
                          - tier iv
                      system:
                        const: AMP/ASCO/CAP Guidelines, 2017
        required:
          - classification
          - specifiedBy
      - if:
          properties:
            classification:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier i
                  required: [code]
              required: [primaryCoding]
          required: [classification]
        then:
          properties:
            hasEvidenceLines:
              oneOf:
                - $refCurie: gks.core:iriReference
                - $ref: "#/$defs/DiagnosticEvidenceLine"
                - $ref: "#/$defs/PrognosticEvidenceLine"
                - $ref: "#/$defs/TherapeuticEvidenceLine"
            classification:
              type: object
              properties:
                name:
                  const: Tier I
              required: [name]
            strength:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: strong
                  required: [code]
              required: [primaryCoding]
            direction:
              const: supports
          required: [classification, strength, direction]
      - if:
          properties:
            classification:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier ii
                  required: [code]
              required: [primaryCoding]
          required: [classification]
        then:
          properties:
            hasEvidenceLines:
              oneOf:
                - $refCurie: gks.core:iriReference
                - $ref: "#/$defs/DiagnosticEvidenceLine"
                - $ref: "#/$defs/PrognosticEvidenceLine"
                - $ref: "#/$defs/TherapeuticEvidenceLine"
            classification:
              type: object
              properties:
                name:
                  const: Tier II
              required: [name]
            strength:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: potential
                  required: [code]
              required: [primaryCoding]
            direction:
              const: supports
          required: [classification, strength, direction]
      - if:
          properties:
            classification:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier iii
                  required: [code]
              required: [primaryCoding]
          required: [classification]
        then:
          properties:
            classification:
              type: object
              properties:
                name:
                  const: Tier III
              required: [name]
            strength: false
            direction:
              const: neutral
          required: [direction]
      - if:
          properties:
            classification:
              type: object
              properties:
                primaryCoding:
                  type: object
                  properties:
                    code:
                      const: tier iv
                  required: [code]
              required: [primaryCoding]
          required: [classification]
        then:
          properties:
            classification:
              type: object
              properties:
                name:
                  const: Tier IV
              required: [name]
            strength: false
            direction:
              const: disputes
          required: [direction]
