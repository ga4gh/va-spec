
Scenario 1: Criterion met with default strength (others in same category implicitly not met)

conditions:
  HereditaryCancer:                   #... herediatary cancer mappable concept with conceptType = "Disease"  
  variations:
    NM_004985.5:c.35G>A:              #... vrs representation of the variant, including HGVS expressions, VRS Allele members, etc.
  evidenceLines:
    NM_004985.5:c.35G>A.BA1:
      type: EvidenceLine
      targetProposition:
        subjectVariant: "#/variation/NM_004985.5:c.35G>A"
        predicate: isCausalFor
        objectCondition: "#/conditions/HereditaryCancer"
        geneContextQualifier:
          conceptType: gene
          name: BRCA1
      directionOfEvidenceProvided: disputes
      strengthOfEvidenceProvided:     # MappableConcept object, in which the 'name' field is bound to an enum with ACMG-defined values
        name: strong
      specifiedBy:                    # Method object, in which the 'methodType' field is bound to an enum holding the method types we defined and aligned with ACMG codes
        methodType: Population Data Assessment
      evidenceOutcome:                # MappableConcept object, in which the 'name' field is bound to an enum with ACMG-based values 
        name: BS1                     # or BA1, or BS1_Supporting, . . .  

