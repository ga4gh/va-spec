Scenario 4: All criterion in category (under a shared method) not met (Population Data Assessment codes all not met)

conditions:
  HereditaryCancer:                   #... herediatary cancer mappable concept with conceptType = "Disease"  
  variations:
    NM_004985.5:c.35G>A:              #... vrs representation of the variant, including HGVS expressions, VRS Allele members, etc.
  evidenceLines:
    NM_004985.5:c.35G>A.POP001:
      type: EvidenceLine              # ... but based on a "ACMGv3 POP Pathogenicity Evidence Line" profile defined in the VA Spec 
      targetProposition:
        subjectVariant: "#/variation/NM_004985.5:c.35G>A"
        predicate: isCausalFor
        objectCondition: "#/conditions/HereditaryCancer"
        geneContextQualifier:
          conceptType: gene
          name: BRCA1
      directionOfEvidenceProvided: neutral
      specifiedBy:                    # Method object, in which the 'methodType' field is bound to an enum holding the method types we defined and aligned with ACMG codes
        methodType: ACMGv3.POP        # Population Data Assessment
      evidenceOutcome:                # MappableConcept object, in which the 'name' field is bound to an enum with ACMG-based values 
        name: no_criteria_met         # but if we want this value to be complete and stand on its own (which IMO is kind of the point) - we would want more here, e.g. "no POP critiera met", or "BA1, BS1, BS2, PM2 not met")

